  <style>
    :root {
      --bg: #f6f2ea;
      --ink: #1c2321;
      --muted: #59645f;
      --line: #d7ccbc;
      --panel: #fffaf0;
      --accent: #9b4f2f;
      --accent-soft: #f0d8c4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, #fff4dc, var(--bg) 44%, #e9efe6);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    main {
      width: min(1600px, calc(100vw - 32px));
      margin: 32px auto;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 54px);
      letter-spacing: -0.04em;
    }
    .meta {
      color: var(--muted);
      margin-bottom: 24px;
    }
    section {
      margin: 24px 0;
      padding: 18px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      box-shadow: 0 18px 60px rgba(47, 41, 32, 0.08);
    }
    h2 {
      margin: 0 0 6px;
      font-size: 24px;
    }
    p {
      margin: 0 0 14px;
      color: var(--muted);
    }
    .view-chip-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 14px;
    }
    .view-chip {
      min-width: 140px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: #fff3dd;
    }
    .view-chip strong {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .fixed-view .table-wrap {
      max-height: none;
    }
    .table-wrap {
      overflow: auto;
      max-height: 70vh;
      border: 1px solid var(--line);
      background: #fffdf8;
    }
    table {
      border-collapse: collapse;
      width: max-content;
      min-width: 100%;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 8px 10px;
      vertical-align: top;
      max-width: 360px;
      overflow-wrap: anywhere;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #eadfcf;
      color: #302820;
      text-align: left;
      white-space: nowrap;
    }
    tr:nth-child(even) td { background: #fff8ec; }
    .hint {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      margin-left: 6px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      cursor: help;
    }
    .hint-card {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
      width: min(520px, calc(100vw - 32px));
      padding: 14px;
      border: 1px solid var(--line);
      background: #fffaf0;
      box-shadow: 0 18px 55px rgba(34, 28, 20, 0.2);
      color: var(--ink);
      white-space: normal;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease;
    }
    .hint-card strong {
      display: block;
      margin: 8px 0 4px;
      color: var(--accent);
    }
    .hint[data-open="true"] .hint-card {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
