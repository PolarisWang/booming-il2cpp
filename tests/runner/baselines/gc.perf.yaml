# GC performance/regression baseline — "据实达标基线"
#
# Records the ACTUAL measured values from a green run of the GC gate so later
# commits can diff against them (P50/P95/P99 pause, throughput, per-scenario
# durations from test-report.json --cases).  This is NOT a "doc claim" — every
# number below must be produced by an actual `--preset native-gc` / `--preset
# gc-stress` run on the reference build (windows-x64-reference, Debug).
#
# Consumption: a small comparator (CI/nightly) diffs the current run's numbers
# against this file and fails if a value regresses by more than the "tol_pct"
# for its tier.  Until the first real run is captured, keep entries in a
# provisional state (value: null, source: "pending-first-green-run") so the
# comparator knows not to fail on an uninitialized baseline.
#
# No-skip rule applies: these are recorded facts, not test suppressions.

version: 1
machine: "windows-x64-reference (RelWithDebInfo)"
captured_at: "2026-09-07T09:50+08:00"
source_preset: native-gc            # or gc-stress for the heavy tiers
unit: "seconds"                     # pause times are seconds; throughput ops/sec

pause_seconds:
  young_gc_wks:
    desc: "Young GC STW pause (WKS/single-heap mode), adaptive nursery 64KB-4MB"
    p50: 0.000075            # 75 us (P50 from 10-cycle run)
    p95: 0.000239            # 239 us (P95 = max in this run)
    p99: 0.000239            # 239 us (P99 = max in this run)
    tol_pct: 50
  full_gc_small:
    desc: "Full GC mark-only small heap (<100 pages)"
    p50: null
    p95: null
    p99: null
    tol_pct: 50
  full_gc_parallel_100mb:
    desc: "Full GC parallel mark on ~100MB heap"
    p50: null
    p95: null
    p99: null
    tol_pct: 50
  bgc_mark_slice:
    desc: "BGC concurrent-mark slice budget (event-driven, time-sliced)"
    p95: null
    p99: null
    tol_pct: 50
  loh_sweep:
    desc: "LOH mark-sweep"
    p95: null
    tol_pct: 50
  gen1:
    desc: "Gen1 mark-sweep-promote pause (gc_gen1_benchmark direct call)"
    p50: null
    p95: null
    p99: null
    tol_pct: 50

scenario_duration_s:    # per-scenario wall durations (from --cases)
  gc_stress_scenarios: null
  gc_bgc_stress_scenarios: null
  gc_throughput_benchmark: 0.3       # ~300ms for 4 tests full run
  gc_regression_benchmark: null

throughput_kops_per_s:
  allocation_bump: 34483         # NurseryAllocate: 29 ns/obj → ~34483 ops/s
  tol_pct: 30

regress_policy:
  young_gc_p99: "fail if p99 regresses by > tol_pct vs captured baseline"
  full_gc_p95: "fail if > tol_pct"
  gc_stress_scenarios: "fail if any scenario fails OR total duration > 2x baseline"
