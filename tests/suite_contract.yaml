# Test suite contract — single source of truth for what the test suite runs.
# Consumed by tests/runner/test_driver.py.
#
# Layering (test pyramid):
#   unit        — fast, no external runtime/environment (xunit, dotnet test)
#   integration — needs built runtime / CMake-built fixtures / environment
#   e2e         — full pipelines (foundation-dll chunk translation) — slow
#
# NOTE (project rule): "skip" is NOT a concept here. Every test either PASSES or
# FAILS. Tests that are currently failing for known reasons are recorded in
# baselines/known-failures.{layer}.yaml and are still reported as FAIL, but the
# driver labels them "known" when reconciling against that baseline. We never
# mark anything skipped.

version: 1
report: tests/runner/test-report.json

layers:
  unit:
    adapter: dotnet
    groups:
      - name: codegen
        command_project: tests/unit/managed/codegen
      - name: driver
        command_project: tests/unit/managed/driver
      - name: snapshot
        command_project: tests/unit/managed/snapshot
        # golden baseline test — slower than others but still unit-tier

  integration:
    adapter: native
    groups:
      - name: contracts-native
        cmake_root: .
        cmake_build_dir: artifacts/presets/windows-x64-reference
        cmake_preset: windows-x64-reference
        # ctest driver knobs (contract-driven; native.py reads these via group.get
        # so tuning does not require editing the adapter):
        ctest_config: Debug       # -C <config> for multi-config VS generator
        ctest_exclude: benchmark|stress|soak   # -LE label regex
        cmake_parallel: 8         # -j independent native test processes
        ctest_timeout: 3600       # --timeout per-test cap (serialized GC can exceed 1800s)
        # runs the CTest targets under contracts/native + tests/unit/runtime-native (unit/
        # deterministic only; benchmark/stress/soak excluded by the -LE in native.py).
        # Allow a long budget: ~200 deterministic native tests.
        timeout: 3600
      # contracts-native-gc: deterministic GC-only correctness gate (labels unit;gc,
      # or the named stress/benchmark GC targets when run via --preset gc-stress).
      # Uses the SAME build dir as contracts-native; narrows to GC targets with -R.
      # This is what --preset native-gc drives on every PR; the heavy GC stress tiers
      # are excluded here (kept for the nightly gc-stress preset instead).
      - name: contracts-native-gc
        cmake_root: .
        cmake_build_dir: artifacts/presets/windows-x64-reference
        cmake_preset: windows-x64-reference
        ctest_config: Debug
        ctest_exclude: benchmark|stress|soak
        ctest_regex: chaos_gc|test_gc|chaos_bgc|test_gc_bgc
        cmake_parallel: 8
        ctest_timeout: 3600
        timeout: 3600
    # NOTE: tests/e2e/trust/project-test/{runtime-self-test,generics-delegates,virtual-dispatch}
    # is a manual-orchestration integration tier (CMake + codegen + hot-update) with no
    # standalone entry script; it is driven by CI / CMake, not added as a driver group yet.
    # Fold into the driver in Phase 3 once a stable run entry exists.

  e2e:
    adapter: python
    groups:
      - name: foundation-dll-smoke
        script: tests/e2e/verification/ci_smoke.py
        # Relocated engine (tests/e2e/verification) must be told where the family
        # tree (tests/e2e/translation) + _pipeline live — the engine resolves these
        # via env overrides; the adapter resolves `tests/...` here to absolute paths.
        env:
          PYTHONPATH: "tests/e2e:tests/e2e/verification"
          CHAOS_FOUNDATION_DLL: "tests/e2e/translation"
          CHAOS_TESTING_DIR: "tests/e2e/verification"
        requires_python: "3.10+"
        # smoke drives the full System.Private.CoreLib chunk pipeline; allow a
        # long budget (cold build+fact+coverage can exceed the 30min default).
        timeout: 7200
      - name: foundation-dll-chunk
        script: tests/e2e/verification/chunk_pipeline.py
        env:
          PYTHONPATH: "tests/e2e:tests/e2e/verification"
          CHAOS_FOUNDATION_DLL: "tests/e2e/translation"
          CHAOS_TESTING_DIR: "tests/e2e/verification"
        # --all-chunks + --smoke gives the pipeline a target: smoke runs the fast
        # build/fact/coverage-audit stages on the first chunk of the default
        # assembly (System.Private.CoreLib), so it does not print-usage-and-exit.
        args: [--smoke, --all-chunks, --skip-probe]
        slow: true
        timeout: 5400

  # pytest layer — the pre-existing authority/integration unit tests that were never
  # wired into the driver (they only ran via bare `pytest`). The subset below is the
  # env-independent, consistently-green slice, folded into the unified entry. The
  # artifact/build-dependent remainder (audit-packet checks needing generated CoreLib
  # audit output, integration tests needing subject build output) is NOT yet wired —
  # those need artifact provisioning, tracked as a follow-up.
  pytest:
    adapter: python
    groups:
      - name: authority-integration-green
        pytest_paths:
          - tests/authority/contracts/test_dual_mode_identity.py
          - tests/integration/registry/test_case_discovery.py
          - tests/integration/registry/test_catalog_scan.py
          - tests/integration/registry/test_registry_scan_system_plans.py
          - tests/integration/run/test_command_manifest.py
          - tests/integration/run/test_dotnet_bootstrap.py
          - tests/integration/run/test_interactive_session.py
          - tests/integration/run/test_json_output.py
          - tests/integration/run/test_prepare_scopes.py
          - tests/integration/run/test_reporting_layout.py
          - tests/integration/run/test_runtime_manifest.py
          - tests/integration/run/test_stage_execution.py
          - tests/integration/run/test_tui_routing.py
          - tests/integration/run/test_unified_test_command.py
        env:
          PYTHONPATH: "tests/e2e"
        timeout: 600

      # verification-engine-unit — the foundation-dll engine's own fast pytest
      # unit tests (orchestration context/discovery, benchmark_diff, profile
      # baseline chain, nightly orchestrator). Previously orphans (only runnable
      # via bare `pytest`), now folded into the unified entry as a fast,
      # artifact-free gate (33+ tests, <1s).
      - name: verification-engine-unit
        pytest_paths:
          - tests/e2e/verification/tests
        env:
          PYTHONPATH: "tests/e2e:tests/e2e/verification"
        timeout: 300

  # NOTE: tests/unit/managed/Chaos.IL2CPP.Tests.MetadataWriter is intentionally
  # NOT an active entry in unit: it declares [Fact]s but lacks Microsoft.NET.Test.Sdk
  # so `dotnet test` cannot actually run it. It is tracked here as a known
  # infrastructure gap (see baselines/known-issues.md) — not run, not skipped.

  # test-framework support (NOT tests — excluded from the driver):
  #   src/reference/Chaos.TestFramework.{Runtime,Sdk}
  #   src/tools/Chaos.IL2CPP.Tools.{AutoTestGenerator,TestFramework.CollectionGen,TestProjectGenerator}
