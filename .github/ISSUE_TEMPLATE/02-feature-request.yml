name: ✨ Feature Request
description: Suggest an idea for this project
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe the problem you're
        trying to solve, not just the solution you have in mind.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What's the use case?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What alternatives have you considered?

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which component does this feature affect?
      options:
        - Runtime (GC / interpreter / JIT)
        - Codegen (IL→C++ translation)
        - Build system (CMake / presets)
        - Testing / CI
        - Documentation
        - Other
    validations:
      required: true