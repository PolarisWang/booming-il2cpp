name: Codegen & Common Regression

on:
  pull_request:
    paths:
      - 'src/managed/Chaos.IL2CPP.Generator/**'
      - 'src/managed/Chaos.IL2CPP.MetadataWriter/**'
      - 'src/native/jit/**'
      - 'src/native/interpreter/**'
      - 'src/native/common/**'
      - 'testing/snapshots/**'
      - 'tests/unit/runtime-native/**'
      - 'tests/unit/managed/**'
      - 'tests/e2e/translation/**'
      - 'contracts/native/v0/**'
  push:
    branches: [main]
    paths:
      - 'src/managed/Chaos.IL2CPP.Generator/**'
      - 'src/managed/Chaos.IL2CPP.MetadataWriter/**'
      - 'src/native/jit/**'
      - 'src/native/interpreter/**'
      - 'src/native/common/**'
      - 'testing/snapshots/**'
      - 'tests/unit/runtime-native/**'
      - 'tests/unit/managed/**'
      - 'tests/e2e/translation/**'
      - 'contracts/native/v0/**'

jobs:
  jit-regression:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Visual Studio Developer Command Prompt
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Restore .NET dependencies
        run: |
          dotnet restore src/managed/Chaos.IL2CPP.Generator/
          dotnet restore tests/unit/managed/snapshot/
          dotnet restore tests/unit/managed/Chaos.IL2CPP.Tests.MetadataWriter/

      - name: Build Chaos.IL2CPP.Generator
        run: dotnet build src/managed/Chaos.IL2CPP.Generator/ --configuration Release --no-restore

      - name: Build Chaos.IL2CPP.Driver
        run: dotnet build src/managed/Chaos.IL2CPP.Driver/ --configuration Release

      - name: Build MetadataWriter Tests
        run: dotnet build tests/unit/managed/Chaos.IL2CPP.Tests.MetadataWriter/ --configuration Release --no-restore

      - name: Run Snapshot Tests
        run: dotnet test tests/unit/managed/snapshot/ --configuration Release --no-restore -v n

      - name: Code Coverage Collection (with threshold)
        run: |
          dotnet test tests/unit/managed/codegen/Chaos.IL2CPP.CodeGen.Tests.csproj `
            --configuration Release `
            --settings tests/unit/managed/codegen/coverlet.runsettings `
            /p:CollectCoverage=true `
            /p:CoverletOutputFormat=cobertura `
            /p:CoverletOutput=coverage-results/coverage.cobertura.xml `
            /p:CoverletThreshold=50 `
            /p:CoverletThresholdType=line `
            /p:CoverletThresholdStat=total

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jit-coverage-report
          path: coverage-results/

      - name: Configure CMake (windows-x64-reference)
        run: |
          cmake -S . -B build/native -G "Visual Studio 17 2022" `
            --toolchain build/toolchains/windows-x64-reference.cmake `
            -DROADMAP0_PRESET_TARGET=windows-x64-reference

      - name: Build Native Libraries
        run: cmake --build build/native --config RelWithDebInfo

      - name: Configure Native Tests
        run: |
          # L11: native CTest suites live at tests/unit/runtime-native (googletest from root CMake).
          cmake -S tests/unit/runtime-native -B tests/unit/runtime-native/build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build Native Tests
        run: cmake --build tests/unit/runtime-native/build --config RelWithDebInfo

      - name: Run Codegen Native Tests
        run: |
          ctest --test-dir tests/unit/runtime-native/build -R "test_jit_native|test_jit_abi|test_jit_il_smoke|test_jit_gc_slot_map|test_jit_osr|test_jit_seh|test_jit_unwind|test_jit_binary_ir|test_jit_mode|test_jit_pgo" --output-on-failure -V 2>&1 | tee jit-native-output.txt

      - name: Run Common Native Tests
        run: ctest --test-dir tests/unit/runtime-native/build -R "test_common" --output-on-failure

      - name: Foundation-DLL CI Smoke
        run: |
          # L6/L7: engine at tests/e2e/verification, families at tests/e2e/translation.
          export PYTHONPATH="$GITHUB_WORKSPACE/tests/e2e:$GITHUB_WORKSPACE/tests/e2e/verification"
          export CHAOS_FOUNDATION_DLL="$GITHUB_WORKSPACE/tests/e2e/translation"
          python -m verification.ci_smoke

      # ── publish-smoke: matrix e2e for the publish path ──────────────
      # Runs app / jit / source-only cases through the repo-built Driver (dev mode).
      # NOTE: this job only runs when the push-to-main path filter at the top of
      # this workflow is satisfied (codegen/jit/interpreter/common changes).  Merges
      # that touch only scripts/, tests/fixtures/, or .github/ will skip this workflow
      # entirely — publish-smoke is not a standalone gate.  A dedicated publish CI
      # workflow (without the codegen path filter) would be needed for that.
      - name: Publish-Smoke (app/jit/source-only)
        if: github.event_name == 'push'
        run: |
          python scripts/publish-smoke.py --json publish-smoke-report.json
      - name: Upload publish-smoke report
        if: github.event_name == 'push' && always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-smoke-report
          path: publish-smoke-report.json

      # ── JIT Performance Baseline ─────────────────────────────────────
      - name: Run JIT Benchmarks
        continue-on-error: true
        run: |
          ctest --test-dir tests/unit/runtime-native/build -R "test_jit_bench" -C RelWithDebInfo --output-on-failure > jit-bench-output.txt 2>&1

      - name: Collect JIT Metrics
        continue-on-error: true
        run: |
          python scripts/ci/collect-jit-metrics.py `
            --benchmark-output="jit-bench-output.txt" `
            --native-output="jit-native-output.txt" `
            --output="jit-metrics-current.json"

      - name: Compare Against Baseline (hard gate)
        # T-A6: remove continue-on-error so a severe perf regression reds the gate.
        # compare-baseline.py exits 0=pass, 1=warning, 2=severe regression.
        id: baseline-check
        run: |
          python scripts/ci/compare-baseline.py `
            --baseline=".github/baselines/jit-metrics.json" `
            --current="jit-metrics-current.json"

      - name: Upload Current Metrics
        uses: actions/upload-artifact@v4
        with:
          name: jit-metrics-current
          path: jit-metrics-current.json
