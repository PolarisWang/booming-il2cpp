name: Codegen & Common Regression

on:
  pull_request:
    paths:
      - 'src/managed/Chaos.IL2CPP.Generator/**'
      - 'src/managed/Chaos.IL2CPP.MetadataWriter/**'
      - 'src/native/jit/**'
      - 'src/native/interpreter/**'
      - 'src/native/common/**'
      - 'testing/snapshots/**'
      - 'testing/src/native/**'
      - 'testing/src/managed/**'
      - 'testing/foundation-dll/**'
      - 'contracts/native/v0/**'
  push:
    branches: [main]
    paths:
      - 'src/managed/Chaos.IL2CPP.Generator/**'
      - 'src/managed/Chaos.IL2CPP.MetadataWriter/**'
      - 'src/native/jit/**'
      - 'src/native/interpreter/**'
      - 'src/native/common/**'
      - 'testing/snapshots/**'
      - 'testing/src/native/**'
      - 'testing/src/managed/**'
      - 'testing/foundation-dll/**'
      - 'contracts/native/v0/**'

jobs:
  jit-regression:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Visual Studio Developer Command Prompt
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Restore .NET dependencies
        run: |
          dotnet restore src/managed/Chaos.IL2CPP.Generator/
          dotnet restore tests/snapshots/Chaos.IL2CPP.CodeGen.SnapshotTests/
          dotnet restore testing/src/managed/Chaos.IL2CPP.Tests.MetadataWriter/

      - name: Build Chaos.IL2CPP.Generator
        run: dotnet build src/managed/Chaos.IL2CPP.Generator/ --configuration Release --no-restore

      - name: Build Chaos.IL2CPP.Driver
        run: dotnet build src/managed/Chaos.IL2CPP.Driver/ --configuration Release

      - name: Build MetadataWriter Tests
        run: dotnet build testing/src/managed/Chaos.IL2CPP.Tests.MetadataWriter/ --configuration Release --no-restore

      - name: Run Snapshot Tests
        run: dotnet test tests/snapshots/Chaos.IL2CPP.CodeGen.SnapshotTests/ --configuration Release --no-restore -v n

      - name: Run MetadataWriter Tests
        run: dotnet test testing/src/managed/Chaos.IL2CPP.Tests.MetadataWriter/ --configuration Release --no-restore -v n

      - name: MetadataWriter Coverage Collection
        run: |
          dotnet test testing/src/managed/Chaos.IL2CPP.Tests.MetadataWriter/ `
            --configuration Release `
            --settings testing/src/managed/Chaos.IL2CPP.Tests.MetadataWriter/coverlet.runsettings `
            "-p:CollectCoverage=true" `
            "-p:CoverletOutputFormat=cobertura" `
            "-p:CoverletOutput=coverage-results/metadatawriter-coverage.cobertura.xml"

      - name: Upload MetadataWriter Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: metadatawriter-coverage-report
          path: coverage-results/metadatawriter-coverage.cobertura.xml

      - name: Code Coverage Collection
        run: |
          dotnet test tests/managed/Chaos.IL2CPP.CodeGen.Tests/Chaos.IL2CPP.CodeGen.Tests.csproj `
            --configuration Release `
            --settings tests/managed/Chaos.IL2CPP.CodeGen.Tests/coverlet.runsettings `
            /p:CollectCoverage=true `
            /p:CoverletOutputFormat=cobertura `
            /p:CoverletOutput=coverage-results/coverage.cobertura.xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jit-coverage-report
          path: coverage-results/

      - name: Configure CMake (windows-x64-reference)
        run: |
          cmake -S . -B build/native -G "Visual Studio 17 2022" `
            --toolchain build/toolchains/windows-x64-reference.cmake `
            -DROADMAP0_PRESET_TARGET=windows-x64-reference

      - name: Build Native Libraries
        run: cmake --build build/native --config RelWithDebInfo

      - name: Configure Native Tests
        run: |
          cd testing
          cmake -S src/native -B artifacts/run/native-test-build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build Native Tests
        run: cmake --build testing/artifacts/run/native-test-build --config RelWithDebInfo

      - name: Run Codegen Native Tests
        run: |
          ctest --test-dir testing/artifacts/run/native-test-build -R "test_jit_native|test_jit_abi|test_jit_il_smoke|test_jit_gc_slot_map|test_jit_osr|test_jit_seh|test_jit_unwind|test_jit_binary_ir|test_jit_mode|test_jit_pgo" --output-on-failure -V 2>&1 | tee jit-native-output.txt

      - name: Run Common Native Tests
        run: ctest --test-dir testing/artifacts/run/native-test-build -R "test_common" --output-on-failure

      - name: Foundation-DLL CI Smoke
        run: |
          cd testing/foundation-dll
          python _core/python/ci_smoke.py

      # ── JIT Performance Baseline ─────────────────────────────────────
      - name: Run JIT Benchmarks
        continue-on-error: true
        run: |
          ctest --test-dir testing/artifacts/run/native-test-build -R "test_jit_bench" -C RelWithDebInfo --output-on-failure > jit-bench-output.txt 2>&1

      - name: Collect JIT Metrics
        continue-on-error: true
        run: |
          python scripts/ci/collect-jit-metrics.py `
            --benchmark-output="jit-bench-output.txt" `
            --native-output="jit-native-output.txt" `
            --output="jit-metrics-current.json"

      - name: Compare Against Baseline
        continue-on-error: true
        id: baseline-check
        run: |
          python scripts/ci/compare-baseline.py `
            --baseline=".github/baselines/jit-metrics.json" `
            --current="jit-metrics-current.json"

      - name: Upload Current Metrics
        uses: actions/upload-artifact@v4
        with:
          name: jit-metrics-current
          path: jit-metrics-current.json
