# AOT Regression Gate
#
# Verifies AOT codegen compilation + smoke testing on PR and push to main.
# Validates that AOT-generated C++ code compiles and key CoreLib families pass.

name: AOT Regression Gate

on:
  workflow_dispatch:
    # [DEGATED] superseded by Pipeline profile (pipeline.yml). Manual only.
    inputs:
      reason:
        description: "Manual override (was auto-triggered)"
        default: "degated-superseded-by-pipeline"
        required: false
        type: string
jobs:
  aot-codegen:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET dependencies
        run: |
          dotnet restore src/managed/Chaos.IL2CPP.Generator/
          dotnet restore tests/unit/managed/snapshot/

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-aot-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-aot-${{ runner.os }}-

      - name: Build Chaos.IL2CPP.Generator
        run: dotnet build src/managed/Chaos.IL2CPP.Generator/ --configuration Release --no-restore

      - name: Build Chaos.IL2CPP.Driver
        run: dotnet build src/managed/Chaos.IL2CPP.Driver/ --configuration Release

      - name: Run Snapshot Tests
        run: dotnet test tests/unit/managed/snapshot/ --configuration Release --no-restore -v n

      - name: Run AOT Smoke Check
        run: |
          python scripts/ci/aot-smoke.py

      - name: Upload AOT Smoke Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aot-smoke-results-${{ matrix.os }}-${{ github.sha }}
          path: aot-smoke-results/
