# Foundation-DLL CI Regression
#
# Runs Foundation-DLL verification pipelines as CI.
# PR trigger: smoke mode (key families only, fast feedback)
# Push to main: full mode (all families, comprehensive verification)
#
# NOTE: this workflow INLINES the base build steps (it does NOT call the reusable
# ci-framework.yml — that file was unused dead config and has been removed).  See
# the Configure/Build steps below for the native foundation-dll build.

name: Foundation-DLL Regression

on:
  pull_request:
    paths:
      - 'src/native/**'
      - 'src/managed/Chaos.IL2CPP.Generator/**'
      - 'src/managed/Chaos.IL2CPP.MetadataWriter/**'
      - 'tests/e2e/translation/**'
      - 'testing/snapshots/**'
      - 'contracts/native/v0/**'
  push:
    branches: [main]
    paths:
      - 'src/native/**'
      - 'src/managed/Chaos.IL2CPP.Generator/**'
      - 'src/managed/Chaos.IL2CPP.MetadataWriter/**'
      - 'tests/e2e/translation/**'
      - 'testing/snapshots/**'
      - 'contracts/native/v0/**'
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = core | full = core+standard | extended = ALL families (comprehensive)"
        default: full
        type: choice
        options:
          - smoke
          - full
          - extended
  # Nightly: foundation-dll is the heaviest multi-stage product verification.  PR only
  # runs smoke; the comprehensive scheduled nightly runs `extended` = ALL families × the
  # full 10-stage set (build,fact,hotupdate,coverage-audit,profile,benchmark,
  # managed_benchmark,benchmark_report,aggregate,reporting + check-regression).  Staggered
  # (05:47) after the GC/native windows nightlies (02:37/03:00/04:07) and off :00/:30.
  schedule:
    - cron: "47 5 * * *"

jobs:
  foundation-dll:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Restore .NET dependencies
        run: |
          dotnet restore src/managed/Chaos.IL2CPP.Generator/
          dotnet restore tests/unit/managed/snapshot/

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-fdci-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-fdci-${{ runner.os }}-

      - name: Build Chaos.IL2CPP.Generator
        run: dotnet build src/managed/Chaos.IL2CPP.Generator/ --configuration Release --no-restore

      - name: Build Chaos.IL2CPP.Driver
        run: dotnet build src/managed/Chaos.IL2CPP.Driver/ --configuration Release

      - name: Run Snapshot Tests
        run: dotnet test tests/unit/managed/snapshot/ --configuration Release --no-restore -v n

      # Native build
      - name: Configure CMake
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build/native -G "Visual Studio 17 2022" \
              --toolchain build/toolchains/windows-x64-reference.cmake \
              -DROADMAP0_PRESET_TARGET=windows-x64-reference
          else
            cmake -S . -B build/native -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCHAOS_IL2CPP_CONFIG_TIER=debug
          fi

      - name: Build Native Libraries
        run: cmake --build build/native --config RelWithDebInfo -j$(nproc 2>/dev/null || echo 4)

      - name: Configure Native Tests
        shell: bash
        run: |
          # L11: native CTest suites live under tests/unit/runtime-native (factory via root CMake).
          # Branch on platform — do NOT "try the windows preset then fall back": on Linux that
          # `cmake --preset windows-x64-reference 2>/dev/null ||` attempt fails (preset is
          # Windows/VS-only) and the error was silently swallowed every run.  Configure the
          # right tree for the actual runner.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --preset windows-x64-reference
          else
            cmake -S . -B build/native-test -DCMAKE_BUILD_TYPE=RelWithDebInfo
          fi

      - name: Build Native Tests
        run: cmake --build build/native-test --config RelWithDebInfo -j$(nproc 2>/dev/null || echo 4)

      # Foundation-DLL execution
      # Restore the benchmark regression history so check-regression has a real
      # cross-run baseline.  benchmark_report writes a date-stamped snapshot per
      # run (comparison-YYYY-MM-DD.json) into *_dll/reports/history; without this
      # cache it is wiped by the clean checkout each run, so ci_smoke --check-regression
      # always sees <2 history files and never actually diffs.  Stable key → history
      # accumulates across nights; post-run save merges the newest snapshot back.
      - name: Restore benchmark regression history (cross-run baseline)
        uses: actions/cache@v4
        with:
          path: tests/e2e/translation/*/_dll/reports/history
          key: fdci-history-${{ runner.os }}
          restore-keys: |
            fdci-history-${{ runner.os }}-

      - name: Determine CI Mode
        id: ci-mode
        shell: bash
        run: |
          # Nightly (schedule) = EXTENDED: ALL families × full 10-stage set (comprehensive).
          # push-to-main = full (core+standard, all stages) for faster feedback.
          # workflow_dispatch honors its own mode input (smoke|full|extended).
          # The stage list is decided INSIDE ci_smoke.py by --mode (full/extended share
          # _FULL_STAGES); the workflow does NOT pass a stage list.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=extended" >> $GITHUB_OUTPUT
            echo "check-regression=--check-regression" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.mode }}" = "full" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "check-regression=--check-regression" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.mode }}" = "extended" ]; then
            echo "mode=extended" >> $GITHUB_OUTPUT
            echo "check-regression=--check-regression" >> $GITHUB_OUTPUT
          else
            echo "mode=smoke" >> $GITHUB_OUTPUT
            echo "check-regression=" >> $GITHUB_OUTPUT
          fi

      - name: Run Foundation-DLL Pipeline
        shell: bash
        id: pipeline
        run: |
          # L6/L7: engine at tests/e2e/verification, families at tests/e2e/translation.
          export PYTHONPATH="$GITHUB_WORKSPACE/tests/e2e:$GITHUB_WORKSPACE/tests/e2e/verification"
          export CHAOS_FOUNDATION_DLL="$GITHUB_WORKSPACE/tests/e2e/translation"
          python -m verification.ci_smoke --mode=${{ steps.ci-mode.outputs.mode }} ${{ steps.ci-mode.outputs.check-regression }} 2>&1 | tee pipeline_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload Foundation-DLL Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-dll-results-${{ matrix.os }}-${{ github.sha }}
          path: |
            tests/e2e/translation/results/
            pipeline_output.txt

      - name: Post PR Comment (on failure or regression)
        if: (failure() || steps.pipeline.outputs.exit_code != '0') && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            let pipelineOutput = '';
            try {
              pipelineOutput = fs.readFileSync('pipeline_output.txt', 'utf8');
            } catch(e) { pipelineOutput = '(could not read pipeline output)'; }

            // Extract failure/regression details from the pipeline output
            const failedFamilies = (pipelineOutput.match(/FAILED families: (.+)/) || [])[1] || '(none)';
            const regressionFamilies = (pipelineOutput.match(/REGRESSED families: (.+)/) || [])[1] || '';
            const regressionLines = (pipelineOutput.match(/\[regression\] .+/g) || []).join('\n');
            const passedLine = (pipelineOutput.match(/CI (Smoke|Full) complete: \d+\/\d+ passed/) || [])[0] || '';

            let body = `## Foundation-DLL CI Report

            Mode: \`${{ steps.ci-mode.outputs.mode }}\`
            Commit: ${{ github.sha }}
            ${passedLine}

            `;

            if (failedFamilies !== '(none)') {
              body += `### ❌ Pipeline Failures
            \`${failedFamilies}\`

            `;
            }

            if (regressionFamilies) {
              body += `### 📉 Benchmark Regressions
            \`${regressionFamilies}\`

            \`\`\`
            ${regressionLines}
            \`\`\`

            `;
            }

            body += `[Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
