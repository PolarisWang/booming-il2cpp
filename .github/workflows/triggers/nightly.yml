# .github/workflows/triggers/nightly.yml
# Nightly trigger → pipeline.yml --profile nightly
name: Nightly Pipeline

on:
  schedule:
    # Nightly full regression. 14:17 UTC ≈ 22:17 Beijing / 07:17 Pacific.
    # Off-minute (17) to avoid the :00 stampede.
    - cron: '17 14 * * *'
  workflow_dispatch:

jobs:
  nightly-pipeline:
    uses: ./.github/workflows/pipeline.yml
    with:
      profile: nightly

  # Nightly-notify: auto-file a GitHub issue when a nightly (schedule) run
  # fails, listing the failed stage(s).  Dedup: if an issue with the same
  # title exists, update it (append a new comment) instead of creating a new one.
  nightly-notify:
    runs-on: ubuntu-latest
    needs: [nightly-pipeline]
    if: ${{ always() && needs.nightly-pipeline.outputs.failed_stages != '' }}
    permissions:
      issues: write
    steps:
      - name: Auto-file issue for nightly failure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const failed = '${{ needs.nightly-pipeline.outputs.failed_stages }}';
            const parts = failed.split(',').filter(Boolean);
            const sha = '${{ github.sha }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const names = parts.map(s => '`' + s + '`').join(', ');
            const title = `[nightly] Pipeline failed${sha ? ' @ ' + sha.slice(0, 8) : ''}`;
            const body =
              `Nightly pipeline failed.\n\n` +
              (names ? `**Failed stage(s):** ${names}\n\n` : '') +
              `- Workflow run: ${runUrl}\n` +
              `- Commit: ${sha}\n\n` +
              `A human must triage this. (auto-filed by nightly-notify)`;
            // Dedup: search ALL open issues (paginated) with the same title prefix.
            // per_page:100 + pagination avoids the per_page:30 blind spot that
            // would miss the existing issue when the repo has more open issues
            // than the page size.
            let hit = null;
            let page = 1;
            const perPage = 100;
            while (true) {
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: perPage,
                page,
              });
              hit = issues.find(i => i.title === title);
              if (hit || issues.length < perPage) break;
              page++;
            }
            if (hit) {
              // Update the issue body (rather than appending an endless comment
              // thread) so the most recent failure state is always visible at
              // a glance.  Previous failure details are still in the issue's
              // event history.
              const updatedBody = body + `\n\n---\n*This is an automated update — previous body has been replaced.*`;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: hit.number,
                body: updatedBody,
              });
              console.log(`Updated nightly-failure issue #${hit.number} body (not appending comment)`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body,
              });
              console.log(`Created new nightly-failure issue: ${title}`);
            }