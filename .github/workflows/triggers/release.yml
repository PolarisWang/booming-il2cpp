# .github/workflows/triggers/release.yml
# Release trigger → pipeline.yml --profile release
#
# Triggered by pushing a v* SemVer tag.  Calls the pipeline orchestrator with
# profile=release, which runs the pre-release gate (gc-stress, jit-baseline,
# arm64-jit, foundation-dll extended, etc.) before the independent release.yml
# builds SDKs and publishes the GitHub Release.
name: Release Pipeline

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.0)'
        required: false
        type: string

jobs:
  release-pipeline:
    uses: ./.github/workflows/pipeline.yml
    with:
      profile: release