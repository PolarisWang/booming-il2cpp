# .github/workflows/pipeline.yml
# Pipeline orchestrator — dispatches stages from a profile YAML.
#
# 3-layer architecture:
#   - Stage definitions: .github/workflows/<stage>.yml (reusable workflow_call)
#   - Profile config:    .github/pipelines/<profile>.yml (YAML: which stage to run)
#   - Orchestrator:      this file (resolve profile → dispatch each enabled stage)
#
# GitHub constraint: reusable workflow `uses:` cannot take a dynamic stage name, so
# every stage is an explicit job whose `if:` is gated on the profile's enabled set
# (computed by .github/scripts/ci_resolve_profile.py exported as JSON array).
#
# To add a new stage: (1) create .github/workflows/<name>.yml, (2) add a
# dispatcher job below, (3) add to .github/pipelines/<profile>.yml.

name: Pipeline
on:
  push:
    branches: [main]
    paths:
      # Trigger on codegen/CI changes — the PR profile is fast enough for push.
      # Nightly/release profiles use the schedule/tag triggers.
      - 'src/managed/Chaos.IL2CPP.Generator/**'
      - 'src/managed/Chaos.IL2CPP.MetadataWriter/**'
      - 'src/tools/**'
      - 'CMakeLists.txt'
      - '**/*.cmake'
      - 'tests/e2e/translation/**'
      - 'tests/suite_contract.yaml'
      - 'System.Private.CoreLib/**'
      - '.github/workflows/**'
      - '.github/pipelines/**'
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
        description: "Pipeline profile name (pr, nightly, release)"
    outputs:
      failed_stages:
        description: "Comma-separated list of failed/cancelled stage names; empty = all green"
        value: ${{ jobs.finish.outputs.failed_stages }}
      enabled_count:
        description: "Number of stages that actually ran (non-skipped) for this profile"
        value: ${{ jobs.finish.outputs.enabled_count }}
  workflow_dispatch:
    inputs:
      profile:
        required: true
        type: choice
        options:
          - pr
          - nightly
          - release
        default: pr

jobs:
  # ── Resolve: which stages does this profile enable? ──
  resolve:
    runs-on: ubuntu-latest
    outputs:
      stages: ${{ steps.parse.outputs.stages }}
      modes: ${{ steps.parse.outputs.modes }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        name: Resolve enabled stages from profile
        env:
          PROFILE: ${{ github.event.inputs.profile || inputs.profile || 'pr' }}
          ROOT: ${{ github.workspace }}
        run: |
          python3 -m pip install pyyaml --quiet
          # Compute changed paths for path-skip: on PR use HEAD~1 vs base; on push use
          # HEAD~1 vs HEAD; on dispatch no filter (all enabled stages run).
          CHANGED=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin ${{ github.base_ref }} 2>/dev/null || true
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || echo "")
          elif [ "${{ github.event_name }}" = "push" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi
          if [ -n "$CHANGED" ]; then
            python3 .github/scripts/ci_resolve_profile.py "$PROFILE" "$ROOT" "$CHANGED"
          else
            python3 .github/scripts/ci_resolve_profile.py "$PROFILE" "$ROOT"
          fi

  # ── GC domain ────────────────────────────────────────────────────────

  gc-unit:
    name: gc-unit
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'gc-unit') }}
    uses: ./.github/workflows/gc-unit.yml
    with:
      os: windows-latest
      timeout: 120
      stress_scale: 50
      heap_verify: 2

  gc-server-smoke:
    name: gc-server-smoke
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'gc-server-smoke') }}
    uses: ./.github/workflows/gc-server-smoke.yml
    with:
      os: windows-latest
      timeout: 180

  gc-asan:
    name: gc-asan
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'gc-asan') }}
    uses: ./.github/workflows/gc-asan.yml
    with:
      os: windows-latest
      timeout: 240

  gc-linux-tsan:
    name: gc-linux-tsan
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'gc-linux-tsan') }}
    uses: ./.github/workflows/gc-linux-tsan.yml
    with:
      os: ubuntu-latest
      timeout: 600

  gc-stress:
    name: gc-stress
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'gc-stress') }}
    uses: ./.github/workflows/gc-stress.yml
    # gc-stress.yml requests contents: write (for the opt-in update_baseline
    # dispatch path that commits gc.perf.yaml).  A reusable workflow cannot
    # request MORE than the caller grants — mirror the callee's permission here.
    permissions:
      contents: write
    with:
      os: windows-latest
      timeout: 3600

  gc-perf:
    name: gc-perf
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'gc-perf') }}
    uses: ./.github/workflows/gc-perf.yml
    # gc-perf.yml requests contents: write (opt-in update_baseline commits
    # gc.perf.yaml) — a reusable callee can't request more than the caller grants.
    permissions:
      contents: write
    with:
      os: windows-latest
      timeout: 600

  # ── Codegen / JIT domain ─────────────────────────────────────────────

  codegen-unit:
    name: codegen-unit
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'codegen-unit') }}
    uses: ./.github/workflows/codegen-unit.yml
    with:
      os: windows-latest
      timeout: 240

  metadata-writer-unit:
    name: metadata-writer-unit
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'metadata-writer-unit') }}
    uses: ./.github/workflows/metadata-writer-unit.yml
    with:
      os: windows-latest
      timeout: 120

  snapshot-unit:
    name: snapshot-unit
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'snapshot-unit') }}
    # runtime_helper_shapes.h + shape enumeration in runtime_helper_shapes is
    # WINDOWS-STABLE (baselines are maintained/generated on Windows — the
    # generator's per-framework shape enumeration differs subtly on Linux
    # .NET host, so regenerated baselines only match a Windows host).  Running
    # on ubuntu-latest made every fixture drift even after SNAPSHOT_UPDATE;
    # pin to windows-latest so the golden comparison host == baseline host.
    uses: ./.github/workflows/snapshot-unit.yml
    with:
      os: windows-latest
      timeout: 60

  aot-smoke:
    name: aot-smoke
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'aot-smoke') }}
    uses: ./.github/workflows/aot-smoke.yml
    with:
      os: ubuntu-latest
      timeout: 120

  publish-smoke:
    name: publish-smoke
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'publish-smoke') }}
    uses: ./.github/workflows/publish-smoke.yml
    with:
      os: windows-latest
      timeout: 3600

  jit-unit:
    name: jit-unit
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'jit-unit') }}
    uses: ./.github/workflows/jit-unit.yml
    with:
      os: windows-latest
      timeout: 180

  jit-baseline:
    name: jit-baseline
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'jit-baseline') }}
    uses: ./.github/workflows/jit-baseline-stage.yml
    # jit-baseline-stage.yml commits the jit.perf.yaml baseline (contents: write)
    # — callee can't request more than the caller grants.
    permissions:
      contents: write
    with:
      os: ubuntu-latest
      timeout: 1800

  hybrid-jit:
    name: hybrid-jit
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'hybrid-jit') }}
    uses: ./.github/workflows/hybrid-jit.yml
    with:
      os: ubuntu-latest
      timeout: 300

  arm64-jit:
    name: arm64-jit
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'arm64-jit') }}
    uses: ./.github/workflows/arm64-jit.yml
    with:
      os: ubuntu-latest
      timeout: 1200

  # ── Foundation-dll domain ────────────────────────────────────────────

  foundation-verify:
    name: foundation-verify
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'foundation-verify') }}
    uses: ./.github/workflows/foundation-verify.yml
    with:
      os: windows-latest
      timeout: 120

  foundation-dll:
    name: foundation-dll
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'foundation-dll') }}
    uses: ./.github/workflows/foundation-dll.yml
    with:
      os: ubuntu-latest
      timeout: 1800
      # mode from profile (pr=smoke, nightly=full, release=extended), fallback full
      mode: ${{ fromJson(needs.resolve.outputs.modes).foundation-dll || 'full' }}

  # ── Native integration ───────────────────────────────────────────────

  native-integration:
    name: native-integration
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'native-integration') }}
    uses: ./.github/workflows/native-integration.yml
    with:
      os: windows-latest
      timeout: 2400

  # ── Static analysis / style / security ───────────────────────────────

  clang-tidy:
    name: clang-tidy
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'clang-tidy') }}
    uses: ./.github/workflows/clang-tidy-stage.yml
    with:
      os: ubuntu-latest
      timeout: 120

  ubsan:
    name: ubsan
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'ubsan') }}
    uses: ./.github/workflows/ubsan.yml
    with:
      os: ubuntu-latest
      timeout: 240

  style-csharp:
    name: style-csharp
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'style-csharp') }}
    uses: ./.github/workflows/style-csharp.yml
    with:
      os: ubuntu-latest
      timeout: 15

  hygiene:
    name: hygiene
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'hygiene') }}
    uses: ./.github/workflows/hygiene.yml
    with:
      os: ubuntu-latest
      timeout: 15

  secret-scan:
    name: secret-scan
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'secret-scan') }}
    uses: ./.github/workflows/secret-scan-stage.yml
    with:
      os: ubuntu-latest
      timeout: 15

  codeql:
    name: codeql
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'codeql') }}
    uses: ./.github/workflows/codeql-stage.yml
    # codeql-stage requests security-events:write / actions:read / packages:read;
    # caller must grant >= what the callee requests.
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    with:
      os: ubuntu-latest
      timeout: 60

  # ── Docs ─────────────────────────────────────────────────────────────

  docs-build:
    name: docs-build
    needs: [resolve]
    if: ${{ contains(fromJson(needs.resolve.outputs.stages), 'docs-build') }}
    uses: ./.github/workflows/docs-build.yml
    with:
      os: ubuntu-latest
      timeout: 30

  docs-deploy:
    name: docs-deploy
    needs: [resolve, docs-build]
    if: ${{ always() && contains(fromJson(needs.resolve.outputs.stages), 'docs-deploy') }}
    # deploy-pages needs OIDC token; reusable callee can't request more than the
    # caller grants — the caller must mirror the callee's permissions.
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/docs-deploy.yml
    with:
      os: ubuntu-latest
      timeout: 15

  # ── Provenance ───────────────────────────────────────────────────────
  # Runs after every stage so the manifest can record the real outcome set.
  # `always()` is required: a run that failed is precisely when provenance
  # matters most.  It does not gate the pipeline (see finish below).
  provenance-archive:
    name: provenance-archive
    needs: [resolve, finish]
    if: ${{ always() }}
    uses: ./.github/workflows/provenance-archive.yml
    with:
      os: ubuntu-latest
      timeout: 10
      profile: ${{ github.event.inputs.profile || inputs.profile || 'pr' }}
      failed_stages: ${{ needs.finish.outputs.failed_stages }}
      enabled_count: ${{ fromJson(needs.finish.outputs.enabled_count || '0') }}

  # ── Finish (aggregate marker + stage result outputs) ───────────────────
  # Collects every per-stage job's result and emits outputs consumed by the
  # trigger-level workflows (pr/nightly/release) for notification.
  #
  # This is NOT a talisman — each stage job already reds the workflow independently
  # when it fails.  The finish job provides a structured failed_stages summary that
  # the trigger layer uses to write a PR comment / auto-file a nightly issue.
  #
  # Skipped stages (if:false) count as success for `needs`, so this never
  # false-fails on profile-enabled stages that were legitimately left out.
  #
  # MAINTENANCE: when you add a new stage dispatcher job above, add it to this
  # `needs:` list AND to the env block below (R_<STAGE>).  Keeping this list in
  # sync with the dispatcher jobs is the standard GHA trade-off for a dynamic
  # aggregate.
  finish:
    name: pipeline-finish (aggregate)
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - gc-unit
      - gc-server-smoke
      - gc-asan
      - gc-linux-tsan
      - gc-stress
      - gc-perf
      - codegen-unit
      - metadata-writer-unit
      - snapshot-unit
      - aot-smoke
      - publish-smoke
      - jit-unit
      - jit-baseline
      - hybrid-jit
      - arm64-jit
      - foundation-verify
      - foundation-dll
      - native-integration
      - clang-tidy
      - ubsan
      - style-csharp
      - hygiene
      - secret-scan
      - codeql
      - docs-build
      - docs-deploy
    outputs:
      failed_stages: ${{ steps.agg.outputs.failed_stages }}
      enabled_count: ${{ steps.agg.outputs.enabled_count }}
    env:
      PROFILE: ${{ github.event.inputs.profile || inputs.profile || 'pr' }}
      R_GC_UNIT: ${{ needs.gc-unit.result }}
      R_GC_SERVER_SMOKE: ${{ needs.gc-server-smoke.result }}
      R_GC_ASAN: ${{ needs.gc-asan.result }}
      R_GC_LINUX_TSAN: ${{ needs.gc-linux-tsan.result }}
      R_GC_STRESS: ${{ needs.gc-stress.result }}
      R_GC_PERF: ${{ needs.gc-perf.result }}
      R_CODEGEN_UNIT: ${{ needs.codegen-unit.result }}
      R_METADATA_WRITER_UNIT: ${{ needs.metadata-writer-unit.result }}
      R_SNAPSHOT_UNIT: ${{ needs.snapshot-unit.result }}
      R_AOT_SMOKE: ${{ needs.aot-smoke.result }}
      R_PUBLISH_SMOKE: ${{ needs.publish-smoke.result }}
      R_JIT_UNIT: ${{ needs.jit-unit.result }}
      R_JIT_BASELINE: ${{ needs.jit-baseline.result }}
      R_HYBRID_JIT: ${{ needs.hybrid-jit.result }}
      R_ARM64_JIT: ${{ needs.arm64-jit.result }}
      R_FOUNDATION_VERIFY: ${{ needs.foundation-verify.result }}
      R_FOUNDATION_DLL: ${{ needs.foundation-dll.result }}
      R_NATIVE_INTEGRATION: ${{ needs.native-integration.result }}
      R_CLANG_TIDY: ${{ needs.clang-tidy.result }}
      R_UBSAN: ${{ needs.ubsan.result }}
      R_STYLE_CSHARP: ${{ needs.style-csharp.result }}
      R_HYGIENE: ${{ needs.hygiene.result }}
      R_SECRET_SCAN: ${{ needs.secret-scan.result }}
      R_CODEQL: ${{ needs.codeql.result }}
      R_DOCS_BUILD: ${{ needs.docs-build.result }}
      R_DOCS_DEPLOY: ${{ needs.docs-deploy.result }}
    steps:
      - id: agg
        run: |
          fail=0
          enabled=0
          failed_list=""
          for s in \
            "gc-unit:$R_GC_UNIT" "gc-server-smoke:$R_GC_SERVER_SMOKE" \
            "gc-asan:$R_GC_ASAN" "gc-linux-tsan:$R_GC_LINUX_TSAN" \
            "gc-stress:$R_GC_STRESS" "gc-perf:$R_GC_PERF" \
            "codegen-unit:$R_CODEGEN_UNIT" "metadata-writer-unit:$R_METADATA_WRITER_UNIT" \
            "snapshot-unit:$R_SNAPSHOT_UNIT" "aot-smoke:$R_AOT_SMOKE" \
            "publish-smoke:$R_PUBLISH_SMOKE" "jit-unit:$R_JIT_UNIT" \
            "jit-baseline:$R_JIT_BASELINE" "hybrid-jit:$R_HYBRID_JIT" \
            "arm64-jit:$R_ARM64_JIT" "foundation-verify:$R_FOUNDATION_VERIFY" \
            "foundation-dll:$R_FOUNDATION_DLL" "native-integration:$R_NATIVE_INTEGRATION" \
            "clang-tidy:$R_CLANG_TIDY" "ubsan:$R_UBSAN" \
            "style-csharp:$R_STYLE_CSHARP" "hygiene:$R_HYGIENE" \
            "secret-scan:$R_SECRET_SCAN" "codeql:$R_CODEQL" \
            "docs-build:$R_DOCS_BUILD" "docs-deploy:$R_DOCS_DEPLOY" \
          ; do
            stage="${s%%:*}"
            res="${s#*:}"
            [ -z "$res" ] && res="skipped"
            case "$res" in
              failure|cancelled)
                fail=1
                enabled=$((enabled+1))   # a failed/cancelled stage still RAN (non-skipped)
                failed_list="${failed_list}${failed_list:+,}${stage}"
                echo "::error::Pipeline profile=$PROFILE: stage $stage=$res"
                ;;
              success)
                enabled=$((enabled+1))
                ;;
              *) ;;  # skipped → not run; excluded from enabled_count
            esac
          done
          echo "failed_stages=$failed_list" >> "$GITHUB_OUTPUT"
          echo "enabled_count=$enabled" >> "$GITHUB_OUTPUT"
          echo "Profile=$PROFILE enabled=$enabled failed=${failed_list:-none}"
          if [ "$fail" = "1" ]; then
            exit 1
          fi
