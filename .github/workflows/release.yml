# Release workflow — triggered by pushing a v* SemVer tag.
#
# Builds all platform SDKs, generates checksums + SBOM, creates a GitHub Release
# with release notes + artifacts.
#
# Trigger:
#   git push origin v<version>
#   (e.g. git push origin v0.1.0)
#
# The release branch (release/X.Y.x) must already exist and be in sync with the tag.
# See scripts/release.sh for the complete orchestration.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'   # v0.1.0, v0.1.0-rc1, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.0)'
        required: true
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ── Extract version from tag ───────────────────────────────────────────────
  version:
    name: Resolve version
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      tag_ref: ${{ steps.parse.outputs.tag_ref }}
    steps:
      # Resolve the effective tag from either a push (github.ref_name is the tag)
      # or a workflow_dispatch manual `tag` input.
      - id: tag
        shell: bash
        run: |
          TAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            # Manual dispatch REQUIRES an explicit SemVer tag.  Falling back to
            # github.ref_name (the branch, e.g. main/develop) would silently
            # build+upload a malformed release named after the branch — the most
            # common and least-noticed manual-dispatch mistake.  Fail loudly.
            if [ -z "$TAG" ]; then
              echo "::error::workflow_dispatch requires input 'tag' (e.g. v0.3.0). Refusing to release branch $GITHUB_REF_NAME."
              exit 1
            fi
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
      - id: parse
        shell: bash
        run: |
          VER="${TAG#v}"                        # strip leading v
          PRERELEASE="false"
          if [[ "$VER" == *-* ]]; then           # has prerelease suffix
            PRERELEASE="true"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "tag_ref=$TAG" >> "$GITHUB_OUTPUT"

  # ── Build SDK (Windows x64 reference) ──────────────────────────────────────
  build-windows:
    name: Build SDK (Windows x64)
    needs: [version]
    runs-on: ${{ vars.RUNNER_WIN || 'windows-latest' }}
    steps:
      - name: Enable long paths (Windows workaround for archive docs)
        shell: bash
        run: git config --global core.longpaths true
      - uses: actions/checkout@${{ vars.ACTIONS_CHECKOUT_VER || 'v4' }}
        with:
          submodules: ${{ vars.CHECKOUT_SUBMODULES || 'recursive' }}
          fetch-depth: ${{ vars.CHECKOUT_DEPTH || 0 }}
      - uses: actions/setup-dotnet@${{ vars.ACTIONS_SETUP_DOTNET_VER || 'v4' }}
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION || '8.0.x' }}
      - name: Restore NuGet packages
        run: dotnet restore src/managed/Chaos.IL2CPP.Generator/
      - name: Build Generator
        run: dotnet build src/managed/Chaos.IL2CPP.Generator/ --configuration Release --no-restore
      - name: Restore Driver NuGet packages
        run: dotnet restore src/managed/Chaos.IL2CPP.Driver/
      - name: Build Driver (dotnet tool)
        run: dotnet build src/managed/Chaos.IL2CPP.Driver/ --configuration Release --no-restore
      - name: Build native SDK libs (test-free targets only)
        shell: bash
        run: |
          cmake -S . -B artifacts/presets/windows-x64-reference \
            -A x64 \
            -DROADMAP0_PRESET_TARGET=windows-x64-reference
          # Build only the library targets, not the test/contract trees.
          cmake --build artifacts/presets/windows-x64-reference \
            --target chaos_common --config RelWithDebInfo
          cmake --build artifacts/presets/windows-x64-reference \
            --target chaos_pal --config RelWithDebInfo
          cmake --build artifacts/presets/windows-x64-reference \
            --target chaos_runtime_core --config RelWithDebInfo
          echo "  core libs done"
      - name: Collect SDK artifacts
        shell: bash
        run: |
          SDK_DIR="artifacts/release/${{ needs.version.outputs.version }}/windows-x64"
          mkdir -p "$SDK_DIR/lib"
          # Copy built libs (flattened)
          find artifacts/presets/windows-x64-reference -type f \( -name '*.lib' -o -name '*.dll' -o -name '*.exe' -o -name '*.pdb' \) -exec cp {} "$SDK_DIR/lib/" \; 2>/dev/null || true
          # If the SdkEmitter include tree was built (generated by a prior step),
          # bundle it too.  Fresh CI checkouts where it wasn't run still produce a
          # lib-only SDK bundle — the copy below is silently skipped.
          if [ -d "tests/e2e/translation/sdk/windows-x64-reference" ]; then
            cp -r tests/e2e/translation/sdk/windows-x64-reference/. "$SDK_DIR/"
          fi
          echo "SDK artifacts: $(find "$SDK_DIR" -type f | wc -l) files"
      - name: Upload SDK artifact
        uses: actions/upload-artifact@${{ vars.ACTIONS_UPLOAD_ARTIFACT_VER || 'v4' }}
        with:
          name: sdk-windows-x64-${{ needs.version.outputs.version }}
          path: artifacts/release/${{ needs.version.outputs.version }}/windows-x64

  # ── Build SDK (Linux x64) — KNOWN FAILURE, tracked separately.
  # The linux native SDK has portability gaps (BCrypt + method_table symbols
  # not yet implemented on linux).  This job is kept for reference and will
  # be fixed in a dedicated task; it is NOT required for the Release to go
  # out (the checksums + publish jobs only depend on the Windows build).
  # See: https://github.com/PolarisWang/booming-il2cpp/issues/xxx
  build-linux:
    name: Build SDK (Linux x64)
    needs: [version]
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    if: ${{ false }}  # disabled until linux portability gaps are resolved
    steps:
      - uses: actions/checkout@${{ vars.ACTIONS_CHECKOUT_VER || 'v4' }}
        with:
          submodules: ${{ vars.CHECKOUT_SUBMODULES || 'recursive' }}
          fetch-depth: ${{ vars.CHECKOUT_DEPTH || 0 }}
      - name: Install system dependencies (gcc-14 + ninja + libnuma)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-14 g++-14 ninja-build libnuma-dev libssl-dev
      - uses: actions/setup-dotnet@${{ vars.ACTIONS_SETUP_DOTNET_VER || 'v4' }}
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION || '8.0.x' }}
      - name: Restore NuGet packages
        run: dotnet restore src/managed/Chaos.IL2CPP.Generator/
      - name: Build Generator
        run: dotnet build src/managed/Chaos.IL2CPP.Generator/ --configuration Release --no-restore
      - name: Build SDK (cmake linux-x64-native)
        shell: bash
        run: |
          cmake --preset linux-x64-native
          # No buildPreset is defined for linux (CMakePresets.json's buildPresets list is
          # empty), so build against the configure-output directory explicitly.
          cmake --build artifacts/presets/linux-x64-native -j$(nproc 2>/dev/null || echo 2)
      - name: Collect SDK artifacts
        shell: bash
        run: |
          SDK_DIR="artifacts/release/${{ needs.version.outputs.version }}/linux-x64"
          mkdir -p "$SDK_DIR/lib"
          find artifacts/presets/linux-x64-native -type f \( -name '*.a' -o -name '*.so' \) -exec cp {} "$SDK_DIR/lib/" \; 2>/dev/null || true
          if [ -d "tests/e2e/translation/sdk/linux-x64-profile" ]; then
            cp -r tests/e2e/translation/sdk/linux-x64-profile/. "$SDK_DIR/"
          fi
          echo "SDK artifacts: $(find "$SDK_DIR" -type f | wc -l) files"
      - name: Upload SDK artifact
        uses: actions/upload-artifact@${{ vars.ACTIONS_UPLOAD_ARTIFACT_VER || 'v4' }}
        with:
          name: sdk-linux-x64-${{ needs.version.outputs.version }}
          path: artifacts/release/${{ needs.version.outputs.version }}/linux-x64

  # ── Generate release notes ─────────────────────────────────────────────────
  release-notes:
    name: Generate release notes
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    needs: [version]
    steps:
      - uses: actions/checkout@${{ vars.ACTIONS_CHECKOUT_VER || 'v4' }}
        with:
          fetch-depth: ${{ vars.CHECKOUT_DEPTH || 0 }}
      - name: Generate release notes
        shell: bash
        env:
          GENRL_REPO_URL: "https://github.com/${{ github.repository }}"
          TAG_REF: ${{ needs.version.outputs.tag_ref }}
          GENRL_PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          PREV_TAG=$(git describe --abbrev=0 --tags "$TAG_REF^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            bash scripts/generate-release-notes.sh "$PREV_TAG" "$TAG_REF" > release-notes.md
          else
            bash scripts/generate-release-notes.sh "" "$TAG_REF" > release-notes.md
          fi
          echo "Release notes generated ($(wc -c < release-notes.md) bytes)"
          if [ ! -s release-notes.md ]; then
            echo "::error::release notes empty" && exit 1
          fi
      - name: Upload release notes
        uses: actions/upload-artifact@${{ vars.ACTIONS_UPLOAD_ARTIFACT_VER || 'v4' }}
        with:
          name: release-notes
          path: release-notes.md

  # ── Generate checksums + SBOM + consolidate (BEST EFFORT — must NOT gate the Release)
  # The SDK build lane (windows + the disabled linux one) is still maturing; a
  # failure here must not block the Release page from being created.  Release
  # creation (the `publish` job) depends only on `version` + `release-notes`.
  checksums:
    name: Generate checksums + SBOM
    needs: [version, build-windows]
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    if: ${{ always() && needs.build-windows.result != 'failure' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@${{ vars.ACTIONS_CHECKOUT_VER || 'v4' }}
        with:
          fetch-depth: ${{ vars.CHECKOUT_DEPTH || 0 }}
      - name: Download all SDK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sdk-*-${{ needs.version.outputs.version }}
          merge-multiple: false
      - name: Generate checksums + SBOM
        shell: bash
        run: |
          mkdir -p release-artifacts
          for dir in sdk-*; do
            if [ -d "$dir" ]; then
              cp -r "$dir" "release-artifacts/$dir"
            fi
          done
          # Generate checksums + SBOM for the whole release bundle.
          # Filenames are the scripts' defaults (SHA256SUMS / sbom.cyclonedx.json).
          bash scripts/generate-checksums.sh release-artifacts
          bash scripts/generate-sbom.sh release-artifacts "${{ needs.version.outputs.version }}"
      - name: Upload release bundle
        uses: actions/upload-artifact@${{ vars.ACTIONS_UPLOAD_ARTIFACT_VER || 'v4' }}
        with:
          name: release-bundle-${{ needs.version.outputs.version }}
          path: release-artifacts

  # ── Create GitHub Release ──────────────────────────────────────────────────
  # Release creation depends ONLY on `version` + `release-notes`, both of which
  # succeed reliably.  It no longer waits on the SDK build / checksums lanes,
  # which have historically failed (broken windows native SDK test tree, linux
  # portability gaps).  Assets (nupkg, checksums) are attached best-effort from
  # whatever the checksums job produced; a missing bundle does not block the
  # Release from being published.
  publish:
    name: Create GitHub Release
    needs: [version, release-notes]
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@${{ vars.ACTIONS_CHECKOUT_VER || 'v4' }}
        with:
          fetch-depth: ${{ vars.CHECKOUT_DEPTH || 0 }}
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Download release bundle (best effort)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-bundle-${{ needs.version.outputs.version }}
          path: release-bundle
      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TAG_REF="${{ needs.version.outputs.tag_ref }}"
          PRERELEASE="${{ needs.version.outputs.prerelease }}"
          NOTES_FILE="release-notes.md"
          BUNDLE_DIR="release-bundle"
          echo "Creating release $TAG_REF (version=$VERSION prerelease=$PRERELEASE)"
          # --verify-tag fails on workflow_dispatch when the tag hasn't been pushed
          # yet, so skip it for manually triggered runs.
          VERIFY_FLAG=""
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            VERIFY_FLAG="--verify-tag"
          fi
          # If the release already exists (e.g. a prior run), update it rather
          # than error out — makes the job idempotent.
          if gh release view "$TAG_REF" >/dev/null 2>&1; then
            echo "Release $TAG_REF already exists — editing body"
            gh release edit "$TAG_REF" -F "$NOTES_FILE" 2>/dev/null || true
            exit 0
          fi
          gh release create "$TAG_REF" \
            -F "$NOTES_FILE" \
            $([ "$PRERELEASE" = "true" ] && echo "--prerelease") \
            --title "$TAG_REF" \
            $VERIFY_FLAG \
            --draft
          # Upload all files in the bundle (best effort)
          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" -type f \
              | while read -r f; do
                echo "Uploading: $f"
                gh release upload "$TAG_REF" "$f" --clobber 2>/dev/null || true
              done
          else
            echo "No bundle directory, skipping upload"
          fi
          # Publish the draft release once all artifacts are uploaded
          gh release edit "$TAG_REF" --draft=false
          echo "Release $TAG_REF published"
      - name: Notify Feishu on publish success
        if: ${{ success() }}
        shell: bash
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          # Generate the structured summary fields from release-notes.md
          # (the release-notes job artifact downloaded above).
          PREV_TAG="$(git describe --abbrev=0 --tags "${{ needs.version.outputs.tag_ref }}^" 2>/dev/null || git rev-list --max-parents=0 HEAD 2>/dev/null | tail -1)"
          if [ -s "release-notes.md" ]; then
            eval "$(bash scripts/release_notes_summary.sh release-notes.md "$PREV_TAG" "${{ needs.version.outputs.tag_ref }}")"
          fi
          # Prepare all card env, then invoke the notifier in the same shell so the
          # exported FEISHU_* (incl. the summary-derived ones) are visible to it.
          export FEISHU_EVENT=published \
            FEISHU_VERSION="${{ needs.version.outputs.version }}" \
            FEISHU_ACTOR="${{ github.actor }}" \
            FEISHU_ENV="生产" \
            FEISHU_TIME_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            FEISHU_REPO="${{ github.repository }}" \
            FEISHU_RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag_ref }}" \
            FEISHU_ARTIFACTS="chaos-il2cpp.${{ needs.version.outputs.version }}.nupkg · SHA256SUMS · SBOM"
          bash scripts/notify-feishu.sh
      - name: Notify Feishu on publish failure
        if: ${{ failure() }}
        shell: bash
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        continue-on-error: true
        run: |
          export FEISHU_EVENT=failed \
            FEISHU_VERSION="${{ needs.version.outputs.version }}" \
            FEISHU_ACTOR="${{ github.actor }}" \
            FEISHU_ENV="CI" \
            FEISHU_TIME_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            FEISHU_REPO="${{ github.repository }}" \
            FEISHU_FAILED_STAGE="CI Release pipeline (tag ${{ needs.version.outputs.tag_ref }})" \
            FEISHU_FAILED_DETAILS="Check the Actions run log for the failing job." \
            FEISHU_LOG_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          bash scripts/notify-feishu.sh