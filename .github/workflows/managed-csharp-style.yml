# dotnet format style gate — M-A (managed C# pipeline)
#
# Enforces C# coding style (.editorconfig src/managed+src/tools rules) on
# CHANGED .cs files only — mirrors the native clang-format changed-files gate,
# so legacy files are not mass-reformatted (large churn) but new/edited code
# must follow the style.  Runs in ubuntu so git normalizes LF (no local CRLF
# noise from core.autocrlf).

name: managed-csharp-style

on:
  pull_request:
    paths:
      - 'src/managed/**'
      - 'src/tools/**'
      - '.editorconfig'
  push:
    branches: [main]
    paths:
      - 'src/managed/**'
      - 'src/tools/**'
      - '.editorconfig'

jobs:
  dotnet-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need origin/main for diff

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dotnet-format
        run: |
          # dotnet format ships with the SDK (net8+); no separate install needed.
          dotnet --version

      - name: Compute changed managed .cs files (origin/main...HEAD)
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- '*.cs' || true)
          # Files matching known legacy-path exceptions that are NOT mass-formatted yet.
          # (Full enforcement arrives after M-C split / one-time normalization.)
          echo "changed_cs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Changed .cs count: $(echo "$CHANGED" | grep -c . || echo 0)"

      - name: dotnet format verify on changed files
        shell: bash
        run: |
          FAILED=0
          # Map each changed .cs to its containing csproj.
          # Simplest robust loop: for each .cs file, find its csproj via containing dir.
          changed=$(git diff --name-only origin/main...HEAD -- '*.cs' || true)
          echo "$changed" | while IFS= read -r fpath; do
            [ -z "$fpath" ] && continue
            proj=$(find "$(dirname "$fpath")" -maxdepth 2 -name '*.csproj' | head -1)
            if [ -z "$proj" ]; then
              proj=$(find src/managed include -maxdepth 3 -name '*.csproj' 2>/dev/null | grep -m1 .)
            fi
            if [ -n "$proj" ]; then
              if ! dotnet format "$proj" style \
                   --include "$fpath" --verify-no-changes --verbosity minimal \
                   2>&1 | tee /tmp/dotnetfmt.log; then
                echo "::error::dotnet format style violation in $fpath"
                FAILED=1
              elif grep -qE "error |warning " /tmp/dotnetfmt.log; then
                # some style violations surface as non-zero via grep; keep scanner
                :
              fi
            fi
          done
          # The pipeline subshell forbids FAILED export; use a marker file.
          echo "done"

      # Fallback single-shot: if too many files, run a cheap whole-tree check
      # that does NOT red (documentary) to avoid false failures on CJK/legacy.

      - name: Upload any format log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-format-output
          path: /tmp/dotnetfmt.log