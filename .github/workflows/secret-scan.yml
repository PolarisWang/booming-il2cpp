# Secret Scanning (CI-side)
#
# Pre-commit has a local secret regex gate in `.githooks/pre-commit`, but that only
# guards commits made on a machine where `core.hooksPath` has been set (see
# scripts/setup-hooks.sh). A fresh CI clone does NOT run local hooks, so this job
# provides the CI-side secret scan that the local hook relies on as backstop.
#
# Runs on every PR against the changed files (gitleaks scans the pushed tree).

name: Secret Scan

on:
  workflow_dispatch:
    # [DEGATED] superseded by Pipeline profile (pipeline.yml). Manual only.
    inputs:
      reason:
        description: "Manual override (was auto-triggered)"
        default: "degated-superseded-by-pipeline"
        required: false
        type: string
permissions:
  contents: read
  # gitleaks-action v2 wants to comment on PRs; grant minimal write for that only.
  pull-requests: write

jobs:
  scan:
    name: Detect leaked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTICE_TO: |
            Leaked secrets must be revoked, not just committed-removed.
