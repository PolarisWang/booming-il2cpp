# .github/workflows/docs-build.yml
# Stage: Doxygen API docs + verification reports → GitHub Pages artifact
#
# Produces the single artifact that docs-deploy publishes.  Two sources:
#   1. Doxygen output for the native API reference.
#   2. docs/verification/** — the reviewer-facing dashboards and per-DLL pages.
# The second is overlaid via stage_pages_reports.py so a report regenerated by
# the current run replaces the committed snapshot instead of being shadowed by
# it.
name: docs-build
on:
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: ubuntu-latest
      timeout:
        required: false
        type: number
        default: 30

jobs:
  docs-build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen graphviz

      - name: Generate docs
        run: |
          doxygen docs/native-api/Doxyfile
          echo "Generated root: docs/native-api/build/html/index.html"

      - name: Stage verification reports for Pages
        run: |
          # Committed snapshot under docs/verification/ defines the published
          # surface; any report regenerated by this run is overlaid on top so
          # the site reflects the run, not the last commit.  --report-dir can
          # be extended as each report pipeline starts emitting a fresh tree.
          python3 .github/scripts/stage_pages_reports.py \
            --site-root docs/native-api/build/html \
            --report-dir docs/verification
          echo "Pages tree size: $(du -sh docs/native-api/build/html | cut -f1)"

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/native-api/build/html
