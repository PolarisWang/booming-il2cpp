# .github/workflows/stages/docs-build.yml
# Stage: Doxygen API doc generation
# Source: .github/workflows/docs.yml job `build`
name: docs-build
on:
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: ubuntu-latest
      timeout:
        required: false
        type: number
        default: 30

jobs:
  docs-build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen graphviz

      - name: Generate docs
        run: |
          doxygen docs/native-api/Doxyfile
          echo "Generated root: docs/native-api/build/html/index.html"

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/native-api/build/html