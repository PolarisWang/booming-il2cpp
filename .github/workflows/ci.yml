name: Foundation-DLL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-codegen:
    name: Build Codegen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore & Build Generator
        run: dotnet build src/managed/Chaos.IL2CPP.Generator/Chaos.IL2CPP.Generator.csproj --configuration Release
      - name: Restore & Build TPG
        run: dotnet build src/tools/Chaos.IL2CPP.Tools.TestProjectGenerator/Chaos.IL2CPP.Tools.TestProjectGenerator.csproj --configuration Release
      - name: Restore & Build ATG
        run: dotnet build src/tools/Chaos.IL2CPP.Tools.AutoTestGenerator/Chaos.IL2CPP.Tools.AutoTestGenerator.csproj --configuration Release

  foundation-small:
    name: Small Assemblies
    needs: build-codegen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Build SDK (cmake)
        run: |
          cmake --preset windows-x64-reference
          cmake --build --preset windows-x64-reference
      - name: Run Small Batch
        working-directory: testing/foundation-dll
        run: |
          bash ci-run-all.sh "build,fact,benchmark,managed_benchmark,benchmark_report,coverage-audit,aggregate,reporting" "small"
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-small
          path: testing/foundation-dll/*/_dll/reports/latest/
