name: Foundation-DLL CI

on:
  push:
    branches: [main]
    # This is the heaviest gate (3 SDK versions + full SDK cmake build + Small-Batch
    # translation); it fired on ANY change (docs/LICENSE/etc).  Narrow to the
    # foundation-dll inputs: the managed codegen/tools, the SDK build config, and the
    # translation corpus it emits.  Unrelated changes skip the wasted 3-SDK build.
    paths:
      - 'src/managed/Chaos.IL2CPP.Generator/**'
      - 'src/tools/**'
      - 'CMakeLists.txt'
      - '**/*.cmake'
      - 'build/**'
      - 'tests/e2e/translation/**'
      - 'tests/suite_contract.yaml'
      - 'System.Private.CoreLib/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/managed/Chaos.IL2CPP.Generator/**'
      - 'src/tools/**'
      - 'CMakeLists.txt'
      - '**/*.cmake'
      - 'build/**'
      - 'tests/e2e/translation/**'
      - 'tests/suite_contract.yaml'
      - 'System.Private.CoreLib/**'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify:
    name: Build + Small Batch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore & Build Generator
        run: dotnet build src/managed/Chaos.IL2CPP.Generator/Chaos.IL2CPP.Generator.csproj --configuration Release
      - name: Restore & Build TPG
        run: dotnet build src/tools/Chaos.IL2CPP.Tools.TestProjectGenerator/Chaos.IL2CPP.Tools.TestProjectGenerator.csproj --configuration Release
      - name: Restore & Build ATG
        run: dotnet build src/tools/Chaos.IL2CPP.Tools.AutoTestGenerator/Chaos.IL2CPP.Tools.AutoTestGenerator.csproj --configuration Release
      - name: Build SDK (cmake)
        run: |
          cmake --preset windows-x64-reference
          cmake --build --preset windows-x64-reference
      - name: Run Small Batch
        working-directory: tests/e2e/translation
        run: |
          bash ci-run-all.sh "build,fact" "small"
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-small
          path: tests/e2e/translation/*/_dll/reports/latest/
