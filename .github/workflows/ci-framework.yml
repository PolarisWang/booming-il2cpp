# CI Framework — reusable workflow
#
# Provides the base build matrix, caching, and common steps for all CI workflows.
# Called by per-mode workflows (jit, fd, aot, hybrid) via workflow_call.
#
# Trigger management:
#   PR + push-to-main trigger is handled by the CALLING workflow, not here.
#   This reusable workflow only defines the build + test jobs.

name: CI Framework

on:
  workflow_call:
    inputs:
      build_config:
        description: "CMake build config (debug|release|RelWithDebInfo)"
        default: "RelWithDebInfo"
        type: string
      os_matrix:
        description: "OS matrix (json array of strings)"
        default: '["ubuntu-latest"]'
        type: string
      run_jit_tests:
        default: false
        type: boolean
      run_fd_smoke:
        default: false
        type: boolean
      run_aot_smoke:
        default: false
        type: boolean
      run_benchmarks:
        default: false
        type: boolean
      gc_server:
        description: "GC server mode (ON|OFF, or empty for default)"
        default: ""
        type: string
      dotnet_version:
        description: ".NET SDK version for setup-dotnet"
        default: "8.0.x"
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.os_matrix) }}
    runs-on: ${{ matrix.os }}
    outputs:
      cmake_build_dir: ${{ steps.cmake-config.outputs.build_dir }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET ${{ inputs.dotnet_version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Setup MSBuild (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Restore .NET dependencies
        run: |
          dotnet restore src/managed/Chaos.IL2CPP.Generator/
          dotnet restore tests/unit/managed/snapshot/
          dotnet restore tests/unit/managed/Chaos.IL2CPP.Tests.MetadataWriter/

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            build/native
            tests/unit/runtime-native/build
          key: cmake-${{ runner.os }}-${{ inputs.build_config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: cmake-${{ runner.os }}-${{ inputs.build_config }}-

      - name: Build Chaos.IL2CPP.Generator
        run: dotnet build src/managed/Chaos.IL2CPP.Generator/ --configuration Release --no-restore

      - name: Build Chaos.IL2CPP.Driver
        run: dotnet build src/managed/Chaos.IL2CPP.Driver/ --configuration Release

      - name: Build MetadataWriter Tests
        run: dotnet build tests/unit/managed/Chaos.IL2CPP.Tests.MetadataWriter/ --configuration Release --no-restore

      - name: Run Snapshot Tests
        run: dotnet test tests/unit/managed/snapshot/ --configuration Release --no-restore -v n

      - name: Configure CMake (${{ runner.os }})
        id: cmake-config
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build/native -G "Visual Studio 17 2022" \
              --toolchain build/toolchains/windows-x64-reference.cmake \
              -DROADMAP0_PRESET_TARGET=windows-x64-reference
          else
            GC_SERVER_FLAG=""
            if [ -n "${{ inputs.gc_server }}" ]; then
              GC_SERVER_FLAG="-DCHAOS_IL2CPP_GC_SERVER=${{ inputs.gc_server }}"
            fi
            cmake -S . -B build/native -DCMAKE_BUILD_TYPE=${{ inputs.build_config }} \
              -DCHAOS_IL2CPP_CONFIG_TIER=debug ${GC_SERVER_FLAG}
          fi
          echo "build_dir=build/native" >> $GITHUB_OUTPUT

      - name: Build Native Libraries
        run: cmake --build build/native --config ${{ inputs.build_config }} -j$(nproc 2>/dev/null || echo 4)

      - name: Configure Native Tests
        shell: bash
        run: |
          # L11: native CTest suites live at tests/unit/runtime-native (factory + root googletest).
          cmake -S tests/unit/runtime-native -B tests/unit/runtime-native/build -DCMAKE_BUILD_TYPE=${{ inputs.build_config }}
          cmake --build tests/unit/runtime-native/build --config ${{ inputs.build_config }} -j$(nproc 2>/dev/null || echo 4)

      - name: Run Codegen Native Tests
        if: inputs.run_jit_tests
        run: |
          ctest --test-dir tests/unit/runtime-native/build \
            -R "test_jit_native|test_jit_abi|test_jit_il_smoke|test_jit_gc_slot_map|test_jit_osr|test_jit_seh|test_jit_unwind|test_jit_binary_ir|test_jit_mode|test_jit_pgo" \
            --output-on-failure -V 2>&1 | tee jit-native-output.txt

      - name: Upload JIT Test Output
        if: inputs.run_jit_tests
        uses: actions/upload-artifact@v4
        with:
          name: jit-native-output-${{ matrix.os }}
          path: jit-native-output.txt

      - name: Run Common Native Tests
        if: inputs.run_jit_tests
        # L11: ctest against the relocated runtime-native build.
        run: ctest --test-dir tests/unit/runtime-native/build -R "test_common" --output-on-failure

      - name: Foundation-DLL CI Smoke
        if: inputs.run_fd_smoke
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/tests/e2e:$GITHUB_WORKSPACE/tests/e2e/verification"
          export CHAOS_FOUNDATION_DLL="$GITHUB_WORKSPACE/tests/e2e/translation"
          python -m verification.ci_smoke

      - name: AOT Smoke Check
        if: inputs.run_aot_smoke
        run: |
          python scripts/ci/aot-smoke.py

      - name: Run JIT Benchmarks
        if: inputs.run_benchmarks
        continue-on-error: true
        run: |
          ctest --test-dir tests/unit/runtime-native/build \
            -R "test_jit_bench" -C ${{ inputs.build_config }} \
            --output-on-failure > jit-bench-output.txt 2>&1

      - name: Collect JIT Metrics
        if: inputs.run_benchmarks
        continue-on-error: true
        run: |
          python scripts/ci/collect-jit-metrics.py \
            --benchmark-output="jit-bench-output.txt" \
            --native-output="jit-native-output.txt" \
            --output="jit-metrics-current.json"

      - name: Compare Against Baseline
        if: inputs.run_benchmarks
        continue-on-error: true
        id: baseline-check
        run: |
          python scripts/ci/compare-baseline.py \
            --baseline=".github/baselines/jit-metrics.json" \
            --current="jit-metrics-current.json"

      - name: Upload Current Metrics
        if: inputs.run_benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: jit-metrics-current-${{ matrix.os }}
          path: jit-metrics-current.json
