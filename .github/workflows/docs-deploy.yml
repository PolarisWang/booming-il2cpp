# .github/workflows/docs-deploy.yml
# Stage: Deploy docs + verification reports to GitHub Pages
#
# Consumers must sequence this AFTER docs-build: `actions/deploy-pages` reads the
# artifact that `upload-pages-artifact` produced, and there is no implicit
# ordering between sibling workflows.  The orchestrator encodes that with
# `needs: docs-build`; see pipeline.yml.
name: docs-deploy
on:
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: ubuntu-latest
      timeout:
        required: false
        type: number
        default: 15

jobs:
  docs-deploy:
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
