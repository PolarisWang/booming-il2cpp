# CI Failure Notification
#
# Aggregates CI results from all workflows and sends notifications.
# Triggered on workflow run completion via workflow_run events.
#
# Notifications:
#   - PR comment on failure (per-workflow)
#   - GitHub Checks API status
#   - Configurable external notifications (email, webhook)

name: CI Notification

on:
  workflow_run:
    workflows:
      - "Codegen & Common Regression"
      - "Foundation-DLL Regression"
      - "JIT Performance Baseline"
      - "AOT Regression Gate"
      - "Hybrid Regression Gate"
      # Reliability-critical nightly gates + remaining workflows (previously unmonitored):
      - "GC Unit Tests"
      - "GC Stress Nightly"
      - "Native Nightly"
      - "ARM64 JIT CI"
      - "Foundation-DLL CI"
      - "Secret Scan"
      # Pipeline orchestrator — resolve failure or stage-level crashes must be visible:
      - "PR Pipeline"
      - "Pipeline"
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    # issues: write needed to auto-file a tracking issue when a nightly
    # (schedule-event) run fails — see the "Auto-file issue for nightly failures" step.
    permissions:
      issues: write

    steps:
      - name: Check workflow result
        id: check-result
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          RUN_ID="${{ github.event.workflow_run.id }}"
          RUN_URL="${{ github.event.workflow_run.html_url }}"
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          EVENT="${{ github.event.workflow_run.event }}"

          echo "conclusion=$CONCLUSION" >> $GITHUB_OUTPUT
          echo "workflow=$WORKFLOW_NAME" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "run_url=$RUN_URL" >> $GITHUB_OUTPUT
          echo "head_branch=$HEAD_BRANCH" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          echo "event=$EVENT" >> $GITHUB_OUTPUT

          if [ "$CONCLUSION" = "success" ]; then
            echo "status=passed" >> $GITHUB_OUTPUT
          elif [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "timed_out" ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
          else
            echo "status=$CONCLUSION" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR (failure)
        if: |
          steps.check-result.outputs.status == 'failed' &&
          steps.check-result.outputs.event == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: '${{ steps.check-result.outputs.head_branch }}'
            });

            if (pulls.length === 0) {
              console.log('No open PR found for branch, skipping comment.');
              return;
            }

            const pr = pulls[0];
            const body = `## CI Failure: ${{ steps.check-result.outputs.workflow }}

            Status: \`${{ steps.check-result.outputs.status }}\`
            Commit: ${{ steps.check-result.outputs.head_sha }}
            Workflow: [${{ steps.check-result.outputs.run_id }}](${{ steps.check-result.outputs.run_url }})

            ❌ **${{ steps.check-result.outputs.workflow }}** failed. Please check the workflow run for details.
            `;

            await github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Log notification (non-PR failures)
        if: steps.check-result.outputs.status == 'failed'
        run: |
          echo "CI Failure Notification:"
          echo "  Workflow: ${{ steps.check-result.outputs.workflow }}"
          echo "  Branch: ${{ steps.check-result.outputs.head_branch }}"
          echo "  SHA: ${{ steps.check-result.outputs.head_sha }}"
          echo "  URL: ${{ steps.check-result.outputs.run_url }}"
          echo "  Event: ${{ steps.check-result.outputs.event }}"

      - name: Auto-file issue for nightly (schedule) failures
        # CRITICAL observability fix: a nightly (schedule-event) run failure was
        # previously invisible — the PR-comment path only fires for pull_request, and
        # the non-PR handler just echoed to the log.  Auto-file a tracking issue so a
        # red nightly has a durable, human-visible artifact.
        if: |
          steps.check-result.outputs.status == 'failed' &&
          steps.check-result.outputs.event == 'schedule'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const w = '${{ steps.check-result.outputs.workflow }}';
            const sha = '${{ steps.check-result.outputs.head_sha }}';
            const url = '${{ steps.check-result.outputs.run_url }}';
            const title = `[nightly] ${w} failed${sha ? ' @ ' + sha.substring(0,8) : ''}`;
            // Dedup: don't spam a new issue every night for the same failure — search
            // for an open issue with the same title prefix and update it instead.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 30,
            });
            const hit = existing.find(i => i.title === title);
            const body =
              `Nightly workflow \`${w}\` failed.\n\n` +
              `- Workflow run: ${url}\n` +
              `- Commit: ${sha}\n\n` +
              `A human must triage this. (auto-filed by CI notification)`;
            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: hit.number, body: `Still failing:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body,
              });
            }
