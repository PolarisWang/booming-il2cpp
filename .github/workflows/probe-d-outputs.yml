name: Probe D Outputs
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag'
        required: true
        type: string
jobs:
  noop:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        shell: bash
        run: |
          echo "version=1.0.0" >> "$GITHUB_OUTPUT"
      - run: echo ok
