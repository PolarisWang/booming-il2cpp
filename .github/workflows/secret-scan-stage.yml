# .github/workflows/stages/secret-scan.yml
# Stage: gitleaks secret scanning
# Source: .github/workflows/secret-scan.yml job `scan`
name: secret-scan
on:
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: ubuntu-latest
      timeout:
        required: false
        type: number
        default: 15
    secrets:
      GITHUB_TOKEN:
        required: false

jobs:
  secret-scan:
    name: Detect leaked secrets
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTICE_TO: |
            Leaked secrets must be revoked, not just committed-removed.