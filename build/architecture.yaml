# build/architecture.yaml — Single source of truth for native C++ architecture rules.
#
# Consumed by:
#   - build/check_arch.py (CLI checker)
#   - CMake check_arch_<module> targets
#   - .githooks/pre-commit
#
# Each native module is defined with its source directory, C++ namespace,
# allowed dependencies, and include guard prefix.

modules:
  - name: chaos_common
    path: src/native/common
    namespace: chaos::il2cpp::common
    guard_prefix: CHAOS_IL2CPP_COMMON
    visibility: public
    inherits_from: []

  - name: chaos_runtime_core
    path: src/native/runtime-core
    namespace: chaos::il2cpp::runtime_core
    guard_prefix: CHAOS_IL2CPP_RUNTIME_CORE
    visibility: public
    inherits_from: [chaos_common]

  - name: chaos_hot_update
    path: src/native/hot-update
    namespace: chaos::il2cpp::hot_update
    guard_prefix: CHAOS_IL2CPP_HOT_UPDATE
    visibility: internal
    inherits_from: [chaos_runtime_core]

  - name: chaos_interpreter
    path: src/native/interpreter
    namespace: chaos::il2cpp::interpreter
    guard_prefix: CHAOS_IL2CPP_INTERPRETER
    visibility: internal
    inherits_from: [chaos_runtime_core]

  - name: chaos_support
    path: src/native/support
    namespace: chaos::il2cpp::support
    guard_prefix: CHAOS_IL2CPP_SUPPORT
    visibility: internal
    inherits_from: [chaos_runtime_core]

  - name: chaos_bootstrap
    path: src/native/bootstrap
    namespace: chaos::il2cpp::bootstrap
    guard_prefix: CHAOS_IL2CPP_BOOTSTRAP
    visibility: internal
    inherits_from: [chaos_runtime_core, chaos_hot_update, chaos_support]

  - name: chaos_jit
    path: src/native/jit
    namespace: chaos::il2cpp::jit
    guard_prefix: CHAOS_IL2CPP_CODEGEN
    visibility: internal
    inherits_from: [chaos_runtime_core, chaos_interpreter]

  - name: chaos_engine_bridge
    path: src/native/engine-bridge
    namespace: ""  # anonymous namespace
    guard_prefix: CHAOS_IL2CPP_ENGINE_BRIDGE
    visibility: internal
    inherits_from: [chaos_runtime_core, chaos_bootstrap]

  - name: chaos_benchmark_host
    path: src/native/benchmark-host
    namespace: chaos::il2cpp::benchmark
    guard_prefix: CHAOS_IL2CPP_BENCHMARK
    visibility: internal
    inherits_from: [chaos_runtime_core]

  - name: chaos_proof_host
    path: src/native/proof-host
    namespace: chaos::il2cpp::proof
    guard_prefix: CHAOS_IL2CPP_PROOF
    visibility: internal
    inherits_from: [chaos_runtime_core, chaos_bootstrap]

# Module namespace aliases (backward compat)
namespace_aliases:
  chaos::il2cpp::method_replacement: [chaos_hot_update]

# Global rules
rules:
  # No #pragma once — must use #ifndef / #define guards
  ban_pragma_once: true
  # No #include "../" relative paths
  ban_relative_include: true
  # No using namespace in header files (file scope)
  ban_using_namespace_in_headers: true
  # No NULL macro — use nullptr
  ban_null_macro: true
  # No #include "chaos/..." quote style — use <chaos/...>
  ban_quoted_chaos_include: true
  # .cpp first include must be the corresponding .h
  enforce_first_include: true
