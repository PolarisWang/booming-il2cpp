<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IL2CPP Benchmark Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f3efe6;
    --surface: rgba(255,255,255,0.92);
    --surface-strong: #ffffff;
    --ink: #18201e;
    --muted: #5d6663;
    --line: rgba(24,32,30,0.09);
    --accent: #0f766e;
    --accent-strong: #115e59;
    --ok: #166534;
    --warn: #c2410c;
    --danger: #b91c1c;
    --soft: #6b7280;
    --shadow: 0 18px 40px rgba(22,30,28,0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    background:
      radial-gradient(circle at top left, rgba(15,118,110,0.18), transparent 24%),
      radial-gradient(circle at top right, rgba(194,65,12,0.12), transparent 20%),
      linear-gradient(180deg, #f6f2e9 0%, #ece4d7 100%);
  }
  header {
    padding: 34px 28px 26px;
    color: #f8fafc;
    background: linear-gradient(135deg, rgba(17,94,89,0.96), rgba(24,24,27,0.92));
    border-bottom: 1px solid rgba(255,255,255,0.14);
  }
  header h1 { margin: 0; font-size: clamp(1.8rem, 2.5vw, 2.8rem); }
  header p { margin: 10px 0 0; max-width: 70rem; color: rgba(248,250,252,0.82); }
  .toolbar, .tabs { display: flex; flex-wrap: wrap; gap: 12px; padding: 18px 28px 0; }
  .toolbar label {
    display: flex; flex-direction: column; gap: 6px;
    font-size: 0.76rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  }
  select {
    min-width: 180px; padding: 10px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.9); color: var(--ink); font: inherit;
  }
  .tab {
    border: 0; border-radius: 999px; padding: 10px 16px; font: inherit; font-weight: 700; cursor: pointer;
    background: rgba(255,255,255,0.7); color: var(--muted);
  }
  .tab.active { background: var(--accent); color: #fff; box-shadow: 0 10px 24px rgba(15,118,110,0.22); }
  .panel { display: none; padding: 24px 28px 36px; }
  .panel.active { display: block; }
  .summary-strip, .key-grid, .mode-grid, .detail-grid, .case-strip, .slice-grid {
    display: grid; gap: 14px;
  }
  .summary-strip { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 18px; }
  .key-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin: 18px 0; }
  .mode-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .detail-grid { grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr); }
  .case-strip { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-top: 16px; }
  .slice-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 18px; }
  .surface, .summary-card {
    background: var(--surface); border: 1px solid rgba(255,255,255,0.55); border-radius: 22px;
    box-shadow: var(--shadow); backdrop-filter: blur(10px);
  }
  .summary-card, .surface { padding: 18px 20px; }
  .summary-card .label, .key-card .label {
    display: block; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  }
  .summary-card strong, .key-card strong { display: block; margin-top: 10px; font-size: 1.9rem; line-height: 1; }
  .summary-card small, .key-card small { display: block; margin-top: 8px; color: var(--muted); }
  .subject-list { display: grid; gap: 18px; }
  .subject-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .subject-title { margin: 0; font-size: 1.35rem; }
  .subject-subtitle { margin-top: 8px; color: var(--muted); font-size: 0.95rem; }
  .coverage-pill {
    padding: 10px 14px; border-radius: 999px; font-size: 0.82rem; font-weight: 700;
    background: rgba(15,118,110,0.14); color: var(--accent-strong);
  }
  .coverage-pill.gap { background: rgba(194,65,12,0.12); color: var(--warn); }
  .coverage-pill.stale { background: rgba(185,28,28,0.12); color: var(--danger); }
  .key-card, .mode-card {
    padding: 14px 16px; border-radius: 18px; border: 1px solid var(--line); background: rgba(255,255,255,0.78);
  }
  .case-card {
    padding: 14px 16px; border-radius: 18px; border: 1px solid var(--line); background: rgba(255,255,255,0.72);
  }
  .slice-card {
    padding: 14px 16px; border-radius: 18px; border: 1px solid var(--line); background: rgba(255,255,255,0.78);
  }
  .key-card-baseline {
    background: linear-gradient(135deg, rgba(37,99,235,0.12), rgba(255,255,255,0.9));
    border-color: rgba(37,99,235,0.24);
  }
  .summary-note {
    margin-top: 8px;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.45;
  }
  .delta-positive { color: var(--ok); }
  .delta-negative { color: var(--danger); }
  .delta-neutral { color: var(--muted); }
  .mode-card header {
    padding: 0; margin-bottom: 12px; background: none; color: inherit; border: 0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .mode-card h4 { margin: 0; font-size: 1rem; }
  .status-badge {
    display: inline-flex; align-items: center; padding: 5px 10px; border-radius: 999px;
    font-size: 0.74rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .status-recorded { background: rgba(22,101,52,0.12); color: var(--ok); }
  .status-missing { background: rgba(194,65,12,0.12); color: var(--warn); }
  .status-unsupported { background: rgba(107,114,128,0.12); color: var(--soft); }
  .metric-figure { font-size: 1.45rem; font-weight: 700; line-height: 1.15; }
  .metric-meta { margin-top: 8px; color: var(--muted); font-size: 0.88rem; }
  .pill-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pill {
    display: inline-flex; align-items: center; padding: 4px 9px; border-radius: 999px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.02em;
    background: rgba(24,32,30,0.08); color: var(--ink);
  }
  .pill-accent { background: rgba(15,118,110,0.12); color: var(--accent-strong); }
  .pill-soft { background: rgba(107,114,128,0.12); color: var(--soft); }
  .pill-warn { background: rgba(194,65,12,0.12); color: var(--warn); }
  .section-kicker {
    margin: 0 0 14px;
    font-size: 0.76rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .case-primary { font-weight: 700; font-size: 0.98rem; }
  .case-secondary { margin-top: 6px; color: var(--muted); font-size: 0.84rem; line-height: 1.45; }
  .case-contract { display: grid; gap: 10px; }
  .case-mode-cell { display: grid; gap: 8px; min-width: 180px; }
  .mode-evidence { display: grid; gap: 6px; }
  .mode-evidence .metric-meta { margin-top: 0; }
  .compact-table th, .compact-table td { padding-top: 14px; padding-bottom: 14px; }
  h2 { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { font-size: 0.76rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); font-style: italic; }
  @media (max-width: 960px) { .detail-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>IL2CPP Benchmark Dashboard</h1>
  <p>Managed mean duration is the dashboard baseline. Each subject now surfaces its summary workload, then drills into solution slices and case-level latency deltas against managed.</p>
</header>

<div class="toolbar">
  <label>Platform<select id="platform-select" onchange="renderAll()"></select></label>
  <label>Primary Metric<select id="metric-select" onchange="renderAll()"><option value="meanDurationMs">Mean Duration (ms)</option><option value="meanOpsPerSecond">Mean Ops/sec</option></select></label>
  <label>Trend Mode<select id="trend-mode-select" onchange="renderDetail()"><option value="managed">Managed</option><option value="native">Native</option><option value="interpreter">Interpreter</option></select></label>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('overview', this)">Overview</button>
  <button class="tab" onclick="showTab('detail', this)">Subject Detail</button>
  <button class="tab" onclick="showTab('devices', this)">Device Comparison</button>
</div>

<section class="panel active" id="tab-overview">
  <div class="summary-strip" id="summary-strip"></div>
  <div class="subject-list" id="subject-list"></div>
</section>

<section class="panel" id="tab-detail">
  <div class="toolbar" style="padding:0 0 18px;">
    <label>Subject<select id="subject-select" onchange="renderDetail()"></select></label>
    <label>Device<select id="device-select" onchange="renderDetail()"></select></label>
    <label>Case View<select id="case-filter-select" onchange="renderDetail()"><option value="all">All Cases</option><option value="cross-mode">Cross-mode</option><option value="managed-only">Managed-only</option><option value="attention">Needs Attention</option></select></label>
  </div>
  <div class="detail-grid">
    <div class="surface"><h2>Mode Comparison</h2><canvas id="detail-chart" height="130"></canvas></div>
    <div class="surface" id="detail-summary"></div>
  </div>
  <div class="surface" style="margin-top:18px;"><h2>Recent Trend</h2><canvas id="trend-chart" height="110"></canvas></div>
  <div class="surface" style="margin-top:18px;" id="device-breakdown"></div>
  <div class="surface" style="margin-top:18px;" id="slice-breakdown"></div>
  <div class="surface" style="margin-top:18px;" id="case-breakdown"></div>
</section>

<section class="panel" id="tab-devices">
  <div class="toolbar" style="padding:0 0 18px;">
    <label>Subject<select id="device-subject-select" onchange="renderDevices()"></select></label>
    <label>Mode<select id="device-mode-select" onchange="renderDevices()"><option value="managed">Managed</option><option value="native">Native</option><option value="interpreter">Interpreter</option></select></label>
  </div>
  <div class="surface"><h2>Cross-Device Comparison</h2><canvas id="devices-chart" height="120"></canvas></div>
  <div class="surface" style="margin-top:18px;" id="devices-table"></div>
</section>

}

  const subjectId = document.getElementById('subject-select').value;
  const subject = SUBJECTS[subjectId] || {};
  const devices = Object.keys(subject.latestByDevice || {}).sort();
  document.getElementById('device-select').innerHTML = devices.map((deviceId) => `<option value="${deviceId}">${deviceId}</option>`).join('');
}
function renderDetail() {
  populateDeviceSelect();
  const subjectId = document.getElementById('subject-select').value;
  const deviceId = document.getElementById('device-select').value;
  const metricKey = selectedMetric();
  const trendMode = document.getElementById('trend-mode-select').value;
  const caseFilter = document.getElementById('case-filter-select').value;
  const subject = SUBJECTS[subjectId] || {};
  const overviewSubject = (OVERVIEW.subjects || {})[subjectId] || {};
  const platformEntry = subjectPlatformEntry(subjectId, selectedPlatform()) || overviewSubject;
  const caseSummary = (((subject.caseSummaryByDevice || {})[deviceId]) || {});
  const summaryLabel = summaryWorkloadLabel(overviewSubject);
  const summaryMeta = summaryWorkloadMeta(overviewSubject);
  const modes = (subject.latestByDevice || {})[deviceId] || {};
  const managedBaseline = (((platformEntry || {}).keyMetrics || {}).managedBaseline || null);
  const relativeToManaged = ((((platformEntry || {}).keyMetrics || {}).relativeToManaged) || {});
  const values = MODE_ORDER.map((mode) => {
    const current = modes[mode];
    return current ? metricValue(current.metrics || {}, metricKey) : null;
  });
  const ctx = document.getElementById('detail-chart').getContext('2d');
  if (detailChart) detailChart.destroy();
  detailChart = new Chart(ctx, {
    type: 'bar',
    data: { labels: MODE_ORDER.map(modeLabel), datasets: [{ label: metricKey, data: values, backgroundColor: ['#2563eb', '#0f766e', '#c2410c'] }] },
    options: { responsive: true, plugins: { legend: { display: false } } },
  });
  document.getElementById('detail-summary').innerHTML = `
    <h2>${overviewSubject.displayName || subjectId}</h2>
    <p class="subject-subtitle">${deviceId || 'No device selected'}</p>
    <div class="summary-note">${summaryMeta}</div>
    <div class="key-grid">
      <div class="key-card"><span class="label">Coverage</span><strong>${coverageLabel(platformEntry || { coverage: {} })}</strong><small>${selectedPlatform()}</small></div>
      <div class="key-card key-card-baseline"><span class="label">Managed Baseline</span><strong>${baselineFigure(managedBaseline)}</strong><small>${baselineMeta(managedBaseline)}</small></div>
      <div class="key-card"><span class="label">Native Latency vs Managed</span><strong>${deltaFigure(relativeToManaged.native || null)}</strong><small>${deltaMeta(relativeToManaged.native || null, managedBaseline)}</small></div>
      <div class="key-card"><span class="label">Interpreter Latency vs Managed</span><strong>${deltaFigure(relativeToManaged.interpreter || null)}</strong><small>${deltaMeta(relativeToManaged.interpreter || null, managedBaseline)}</small></div>
      <div class="key-card"><span class="label">Summary Workload</span><strong>${summaryLabel}</strong><small>${summaryMeta}</small></div>
      <div class="key-card"><span class="label">Last Record</span><strong>${formatDate((platformEntry || {}).lastRecordedAt)}</strong><small>${(platformEntry || {}).gitCommit || 'No commit recorded'}</small></div>
    </div>
    <div class="case-strip">
      <div class="case-card"><span class="label">Cases</span><strong>${caseSummary.caseCount || 0}</strong><small>Declared benchmark cases on this device view</small></div>
      <div class="case-card"><span class="label">Cross-mode</span><strong>${caseSummary.crossModeCaseCount || 0}</strong><small>Managed baseline with at least one comparison mode</small></div>
      <div class="case-card"><span class="label">Managed-only</span><strong>${caseSummary.managedOnlyCaseCount || 0}</strong><small>Intentional diagnostics outside native AOT scope</small></div>
      <div class="case-card"><span class="label">Needs Attention</span><strong>${caseSummary.missingCaseCount || 0}</strong><small>Cases missing supported-mode records</small></div>
    </div>
  `;
  const history = ((((subject.history || {})[deviceId]) || {})[trendMode]) || [];
  const trendCtx = document.getElementById('trend-chart').getContext('2d');
  if (trendChart) trendChart.destroy();
  trendChart = new Chart(trendCtx, {
    type: 'line',
    data: {
      labels: [...history].reverse().map((record) => formatDate(record.recordedAt)),
      datasets: [{
        label: `${modeLabel(trendMode)} ${metricKey}`,
        data: [...history].reverse().map((record) => metricValue(record.metrics || {}, metricKey)),
        borderColor: trendMode === 'native' ? '#0f766e' : (trendMode === 'managed' ? '#2563eb' : '#c2410c'),
        tension: 0.25,
      }],
    },
    options: { responsive: true, plugins: { legend: { display: false } } },
  });
  const rows = Object.entries(subject.latestByDevice || {}).map(([currentDeviceId, currentModes]) => `
    <tr>
      <td><strong>${currentDeviceId}</strong></td>
      ${MODE_ORDER.map((mode) => {
        const current = currentModes[mode];
        return current
          ? `<td>${formatMetric(current.metrics || {}, metricKey)}<br><span class="subject-subtitle">${formatDate(current.recordedAt)}</span></td>`
          : '<td><span class="subject-subtitle">unsupported / missing</span></td>';
      }).join('')}
    </tr>
  `).join('');
  document.getElementById('device-breakdown').innerHTML = rows
    ? `<h2>Device Breakdown</h2><table><thead><tr><th>Device</th><th>Managed</th><th>Native</th><th>Interpreter</th></tr></thead><tbody>${rows}</tbody></table>`
    : '<div class="empty">No device records for this subject.</div>';
  const caseEntries = Object.values((((subject.benchmarkCasesByDevice || {})[deviceId]) || {}))
    .filter((caseEntry) => caseFilterMatch(caseEntry, caseFilter))
    .sort((left, right) => String(left.displayName || left.caseId || '').localeCompare(String(right.displayName || right.caseId || '')));
  const sliceCards = groupCasesByAssembly(caseEntries).map((slice) => `
    <div class="slice-card">
      <span class="label">${slice.assemblyName}</span>
      <strong>${slice.caseCount}</strong>
      <small>${slice.crossModeCaseCount} cross-mode · ${slice.managedOnlyCaseCount} managed-only · ${slice.missingCaseCount} gaps</small>
      <div class="pill-list">${pillList((slice.supportedModes || []).map(modeLabel), 'pill-accent')}</div>
      <div class="summary-note">${(slice.caseLabels || []).join(' · ')}</div>
    </div>
  `).join('');
  document.getElementById('slice-breakdown').innerHTML = sliceCards
    ? `<h2>Solution Slice Breakdown</h2><p class="subject-subtitle">Assemblies inside the solution are grouped here so the selected case view shows which slice owns each benchmark contract.</p><div class="slice-grid">${sliceCards}</div>`
    : '<div class="empty">No slice-level benchmark metadata for this subject.</div>';
  const caseRows = caseEntries
    .map((caseEntry) => `
      <tr>
        <td>${caseSliceCell(caseEntry)}</td>
        <td>
          <div class="case-primary">${caseEntry.displayName || caseEntry.caseId}</div>
          <div class="case-secondary">${caseEntry.workloadEntry || caseEntry.caseId || ''}</div>
        </td>
        <td>${caseContractHtml(caseEntry)}</td>
        <td>${caseModeCell(caseEntry, 'managed')}</td>
        <td>${caseModeCell(caseEntry, 'native')}</td>
        <td>${caseModeCell(caseEntry, 'interpreter')}</td>
      </tr>
    `).join('');
  document.getElementById('case-breakdown').innerHTML = caseRows
    ? `<h2>Benchmark Case Matrix</h2><p class="subject-subtitle">Managed is the baseline column. Native and interpreter cells surface latency vs managed first, then keep the raw record evidence for the selected device.</p><table class="compact-table"><thead><tr><th>Solution Slice</th><th>Case</th><th>Contract</th><th>Managed Baseline</th><th>Native Latency vs Managed</th><th>Interpreter Latency vs Managed</th></tr></thead><tbody>${caseRows}</tbody></table>`
    : '<div class="empty">No case-level benchmark records for this subject.</div>';
}
function renderDevices() {
  const subjectId = document.getElementById('device-subject-select').value;
  const mode = document.getElementById('device-mode-select').value;
  const metricKey = selectedMetric();
  const subject = SUBJECTS[subjectId] || {};
  const rows = Object.entries(subject.latestByDevice || {}).map(([deviceId, modes]) => {
    const record = modes[mode];
    return { deviceId, value: record ? metricValue(record.metrics || {}, metricKey) : null, recordedAt: record ? record.recordedAt : null, gitCommit: record ? record.gitCommit : null };
  }).filter((row) => row.value != null);
  const ctx = document.getElementById('devices-chart').getContext('2d');
  if (devicesChart) devicesChart.destroy();
  devicesChart = new Chart(ctx, {
    type: 'bar',
    data: { labels: rows.map((row) => row.deviceId), datasets: [{ label: `${modeLabel(mode)} ${metricUnit(metricKey)}`, data: rows.map((row) => row.value), backgroundColor: '#0f766e' }] },
    options: { responsive: true, indexAxis: 'y', plugins: { legend: { display: false } } },
  });
  document.getElementById('devices-table').innerHTML = rows.length
    ? `<h2>Recorded Devices</h2><table><thead><tr><th>Device</th><th>Metric</th><th>Recorded</th><th>Commit</th></tr></thead><tbody>${rows.map((row) => `
        <tr>
          <td><strong>${row.deviceId}</strong></td>
          <td>${metricKey === 'meanOpsPerSecond' ? `${Number(row.value).toLocaleString(undefined, { maximumFractionDigits: 2 })} ops/s` : `${Number(row.value).toLocaleString(undefined, { maximumFractionDigits: 3 })} ms`}</td>
          <td>${formatDate(row.recordedAt)}</td>
          <td>${row.gitCommit || 'N/A'}</td>
        </tr>`).join('')}</tbody></table>`
    : `<div class="empty">No recorded device data for ${modeLabel(mode)}.</div>`;
}
function renderAll() { renderSummary(); renderOverview(); renderDetail(); renderDevices(); }
(function init() { populateSelectors(); renderAll(); })();
</script>
</body>
</html>
