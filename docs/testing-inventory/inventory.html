  <style>
    :root {
      --bg: #f6f2ea;
      --ink: #1c2321;
      --muted: #59645f;
      --line: #d7ccbc;
      --panel: #fffaf0;
      --accent: #9b4f2f;
      --accent-soft: #f0d8c4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, #fff4dc, var(--bg) 44%, #e9efe6);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    main {
      width: min(1600px, calc(100vw - 32px));
      margin: 32px auto;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 54px);
      letter-spacing: -0.04em;
    }
    .meta {
      color: var(--muted);
      margin-bottom: 24px;
    }
    section {
      margin: 24px 0;
      padding: 18px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      box-shadow: 0 18px 60px rgba(47, 41, 32, 0.08);
    }
    h2 {
      margin: 0 0 6px;
      font-size: 24px;
    }
    p {
      margin: 0 0 14px;
      color: var(--muted);
    }
    .view-chip-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 14px;
    }
    .view-chip {
      min-width: 140px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: #fff3dd;
    }
    .view-chip strong {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .fixed-view .table-wrap {
      max-height: none;
    }
    .table-wrap {
      overflow: auto;
      max-height: 70vh;
      border: 1px solid var(--line);
      background: #fffdf8;
    }
    table {
      border-collapse: collapse;
      width: max-content;
      min-width: 100%;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 8px 10px;
      vertical-align: top;
      max-width: 360px;
      overflow-wrap: anywhere;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #eadfcf;
      color: #302820;
      text-align: left;
      white-space: nowrap;
    }
    tr:nth-child(even) td { background: #fff8ec; }
    .hint {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      margin-left: 6px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      cursor: help;
    }
    .hint-card {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
      width: min(520px, calc(100vw - 32px));
      padding: 14px;
      border: 1px solid var(--line);
      background: #fffaf0;
      box-shadow: 0 18px 55px rgba(34, 28, 20, 0.2);
      color: var(--ink);
      white-space: normal;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease;
    }
    .hint-card strong {
      display: block;
      margin: 8px 0 4px;
      color: var(--accent);
    }
    .hint[data-open="true"] .hint-card {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>

    const data = window.TESTING_INVENTORY_DATA || { tables: [] };
    const fixedViews = data.fixedViews || [];
    const text = (value) => {
      if (Array.isArray(value)) return value.join("; ");
      if (value && typeof value === "object") return JSON.stringify(value);
      if (value === true) return "true";
      if (value === false) return "false";
      return value ?? "";
    };
    const escapeHtml = (value) => String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
    const rich = (value) => Array.isArray(value)

        <table>
          <thead>
            <tr>${table.headers.map((header) => {
              const label = escapeHtml(header.label || header.key);
              return withHints
                ? `<th>${label}${hintHtml(header.hint || {}, header.label || header.key)}</th>`
                : `<th>${label}</th>`;
            }).join("")}</tr>
          </thead>
          <tbody>
            ${table.rows.map((row) => `<tr>${table.headers.map((header) => `<td>${escapeHtml(text(row[header.key]))}</td>`).join("")}</tr>`).join("")}
          </tbody>
        </table>
      </div>`;
    const HINT_VIEWPORT_MARGIN = 12;
    const HINT_CURSOR_OFFSET = 18;
    const hintHtml = (hint, label) => {
      const normalizedLabel = label || hint.label || "字段";
      const tooltipTitle = escapeHtml(hint.summary || hint.definition || `${normalizedLabel} 字段说明`);
      const ariaLabel = escapeHtml(`${normalizedLabel} 字段说明`);
      return `
      <span class="hint" tabindex="0" role="button" title="${tooltipTitle}" aria-label="${ariaLabel}">?
        <span class="hint-card">
          <strong>字段含义</strong>${escapeHtml(hint.definition || hint.summary || "")}
          <strong>为什么有这列</strong>${escapeHtml(hint.why || "")}
          <strong>数据来源</strong>${rich(hint.source)}
          <strong>取值说明</strong>${rich(hint.values)}
          <strong>判定规则</strong>${escapeHtml(hint.rule || "")}
          <strong>空值代表什么</strong>${escapeHtml(hint.emptyMeans || "")}
        </span>
      </span>`;
    };
    const positionHintCard = (hint, anchorX, anchorY) => {
      const card = hint.querySelector(".hint-card");
      if (!card) {
        return;
      }

      const viewportWidth = window.innerWidth || document.documentElement.clientWidth || 0;
      const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
      const cardRect = card.getBoundingClientRect();
      let left = anchorX + HINT_CURSOR_OFFSET;
      let top = anchorY + HINT_CURSOR_OFFSET;

      if (left + cardRect.width > viewportWidth - HINT_VIEWPORT_MARGIN) {
        left = Math.max(HINT_VIEWPORT_MARGIN, anchorX - cardRect.width - HINT_CURSOR_OFFSET);
      }
      if (top + cardRect.height > viewportHeight - HINT_VIEWPORT_MARGIN) {
        top = Math.max(HINT_VIEWPORT_MARGIN, anchorY - cardRect.height - HINT_CURSOR_OFFSET);
      }

      left = Math.min(
        Math.max(HINT_VIEWPORT_MARGIN, left),
        Math.max(HINT_VIEWPORT_MARGIN, viewportWidth - cardRect.width - HINT_VIEWPORT_MARGIN),
      );
      top = Math.min(
        Math.max(HINT_VIEWPORT_MARGIN, top),
        Math.max(HINT_VIEWPORT_MARGIN, viewportHeight - cardRect.height - HINT_VIEWPORT_MARGIN),
      );

      card.style.left = `${left}px`;
      card.style.top = `${top}px`;
    };
    const openHint = (hint, anchorX, anchorY) => {
      positionHintCard(hint, anchorX, anchorY);
      hint.dataset.open = "true";
    };
    const closeHint = (hint) => {
      delete hint.dataset.open;
    };
    const bindHintCards = (root) => {
      root.querySelectorAll(".hint").forEach((hint) => {
        const anchorToHint = () => {
          const rect = hint.getBoundingClientRect();
          openHint(hint, rect.right, rect.bottom);
        };
        hint.addEventListener("mouseenter", anchorToHint);
        hint.addEventListener("mousemove", (event) => openHint(hint, event.clientX, event.clientY));
        hint.addEventListener("focus", anchorToHint);
        hint.addEventListener("mouseleave", () => closeHint(hint));
        hint.addEventListener("blur", () => closeHint(hint));
      });
    };
    const renderFixedView = (view) => `
      <section class="fixed-view">
        <h2>${escapeHtml(view.title || "")}</h2>
        <p>${escapeHtml(view.description || "")}</p>

          <div class="view-chip">

            <span>${escapeHtml(text(chip.value))}</span>
          </div>`).join("")}</div>` : ""}

        ${tableHtml(table)}
      </section>`).join("");
