# Pipeline configuration for foundation-dll verification
# This file is read by chunk_pipeline.py during pipeline setup.

pipeline:
  # Default verification mode for all chunks
  defaultMode: standard

  # Per-chunk assembly search directories (--assembly-dir for codegen).
  # Used when a chunk's subjects reference types from non-runtime assemblies
  # (e.g., game engine DLLs, NuGet packages).
  #
  # Format: semicolon-separated absolute or relative paths.
  # Relative paths are resolved from the foundation-dll directory.
  # Example: chunks/system-net-http/assemblyDirs: ../external-dlls
  #
  # When empty (default): no --assembly-dir is passed, the codegen only loads
  # the subjects DLL itself. Cross-assembly references are resolved by
  # the BRIDGE-AOT compiler via runtime directory discovery.
  chunks:
    numerics:
      assemblyDirs: ""

  # Timeouts in seconds for specific stages
  timeouts:
    codegen_aot: 600
    fact_aot: 600
    benchmark: 600
