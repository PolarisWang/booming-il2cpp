# Soak test configuration

# Total duration in minutes (default 1440 = 24h)
total_duration_min: 1440

# Sampling interval in seconds between system metric snapshots
sampling_interval_sec: 30

# Individual test timeout in seconds
test_timeout_sec: 600

# Phases are executed sequentially. Each phase runs a group of stress
# tests filtered by CTest label for the configured duration.
phases:
  - name: gc
    duration_min: 360
    test_label: stress;gc
    description: "GC subsystem stress — allocation, finalizer, BGC, LOH, oversized"

  - name: core
    duration_min: 240
    test_label: stress;core
    description: "Runtime core stress — capacity, reflection, domain, assembly manager"

  - name: threading
    duration_min: 120
    test_label: stress;threading
    description: "Threading stress — thread pool, object header, monitor"

  - name: interpreter
    duration_min: 120
    test_label: stress;interpreter
    description: "Interpreter stress — FastExecute, concurrent, SEH"

  - name: common
    duration_min: 120
    test_label: stress;common
    description: "Common subsystem stress — log, trace, async, bootstrap"

  - name: all
    duration_min: 480
    test_label: stress
    description: "All stress tests combined — final sweep"

# Output directory for soak report (relative to project root)
output_dir: testing/results/soak
