# Regression Threshold Configuration
#
# Defines per-metric threshold multipliers for CI baseline comparison.
# Thresholds are applied as (current_value / baseline_value) ratios.
#
# Threshold levels:
#   warning:  ratio exceeds this → WARNING (non-blocking, PR comment)
#   severe:   ratio exceeds this → FAILURE (blocks CI, labeled perf-regression)
#
# Threshold tuning:
#   - Start conservative (high thresholds) and tighten as baseline stabilizes
#   - Review quarterly or after major architectural changes
#   - False positive → widen threshold, log the metric name and reason

thresholds:
  # ── JIT Compile Time ──────────────────────────────────────────────────
  # Baseline: ms/method. Higher = slower compilation.
  compile-time-only:
    P50:
      warning: 1.10   # +10% → warning
      severe:  1.25   # +25% → severe regression
    P99:
      warning: 1.15
      severe:  1.30

  # ── Upgrade Latency ───────────────────────────────────────────────────
  # Baseline: microseconds for AOT→JIT upgrade path (Hybrid mode).
  upgrade-latency:
    P50:
      warning: 1.10
      severe:  1.25
    P99:
      warning: 1.15
      severe:  1.30

  # ── Trampoline Allocation ─────────────────────────────────────────────
  # Baseline: microseconds per trampoline allocation.
  trampoline-alloc:
    P50:
      warning: 1.10
      severe:  1.25
    P99:
      warning: 1.15
      severe:  1.30

  # ── Multi-Method Upgrade ──────────────────────────────────────────────
  # Baseline: microseconds per batch of N methods upgraded.
  multi-method-upgrade:
    PER_METHOD_US:
      warning: 1.10
      severe:  1.25
    TOTAL_US:
      warning: 1.15
      severe:  1.30

  # ── Dispatch Overhead ─────────────────────────────────────────────────
  # Baseline: microseconds per dispatch call.
  aot-dispatch-overhead:
    PER_CALL_US:
      warning: 1.10
      severe:  1.25

  compiled-dispatch-overhead:
    PER_CALL_US:
      warning: 1.10
      severe:  1.25

  # ── Code Size ─────────────────────────────────────────────────────────
  # Baseline: bytes per compiled method. Higher = larger generated code.
  code_size:
    p50:
      warning: 1.05   # +5% code size → warning (tighter threshold)
      severe:  1.15   # +15% → severe
    p95:
      warning: 1.05
      severe:  1.15
    avg:
      warning: 1.05
      severe:  1.15

  # ── Foundation-DLL Stage Pass Rate ────────────────────────────────────
  # Baseline: percentage of families passing each stage.
  fd_stage_pass_rate:
    warning: 0.95    # below 95% → warning
    severe:  0.90    # below 90% → severe

# ── False Positive Suppression ──────────────────────────────────────────
# Metrics that are known to be noisy or unreliable for baseline comparison.
# These are logged but do not trigger alerts.
suppressed_metrics:
  - reason: "CI runner performance varies significantly between runs"
    metrics:
      - "bench/upgrade-latency/MAX"
      - "bench/compile-time-only/MAX"
      - "bench/compile-time-only/MIN"

  - reason: "Sample count fluctuations from test selection"
    metrics:
      - "bench/multi-method-upgrade/N"

# ── Baseline Update Policy ──────────────────────────────────────────────
# Controls when the baseline JSON is automatically updated.
baseline_update:
  # Update on push to main when all checks pass
  auto_update_on_main: true

  # Notify on significant baseline shift (ratio > threshold)
  notify_on_shift:
    warning: 1.05
    severe:  1.15

  # Manual baseline reset trigger:
  #   1. After major architectural change
  #   2. After compiler toolchain upgrade
  #   3. Quarterly refresh
  manual_reset_required: false
