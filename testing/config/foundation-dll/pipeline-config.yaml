# Foundation DLL Verification Pipeline Configuration
# Controls which stages run, resource limits, and runtime behavior.
#
# This config is consumed by chunk_pipeline.py via _load_pipeline_config().
# Changes here take effect on next pipeline run.
#
# Stages not listed in timeouts use the orchestrator's default timeout (0 = no limit).

pipeline:
  defaultMode: standard  # "standard" | "strict"

  # Full 13-stage verification pipeline
  defaultStages:
    - preflight
    - codegen_aot
    - jit_codegen
    - fact_aot
    - fact_jit
    - audit
    - asm_compare
    - microbench
    - benchmark
    - hotupdate_aot
    - hotupdate_jit_fact
    - hotupdate_jit_benchmark
    - hotupdate_aot_benchmark

  # Timeout per stage in seconds (0 = no timeout)
  timeouts:
    preflight: 30
    codegen_aot: 600
    jit_codegen: 600
    fact_aot: 120
    fact_jit: 120
    audit: 300
    asm_compare: 120
    microbench: 300
    benchmark: 600
    hotupdate_aot: 300
    hotupdate_jit_fact: 300
    hotupdate_jit_benchmark: 300
    hotupdate_aot_benchmark: 300

  # All stages are active (migration complete)
  migrationSkips: {}

  # Results storage
  resultsDir: results/foundation-dll
  historyDir: results/verification-history

  # Logging
  verbose: false
