# Repository gitleaks config (gitleaks v8.24.x schema).
#
# WHY: the default config's `generic-api-key` rule fires on the crypto-stub HMAC
# source files in src/native/runtime-core/runtime_stubs/*. Their function
# signatures take a byte-array parameter NAMED `key` (e.g.
# `ChaosHmacSha256(CHAOS_IL2CPP_INTPTR key, ...)`). The param is handed straight
# to OpenSSL/BCrypt HMAC as an input; it never holds a literal secret — the key
# bytes always arrive from managed code at runtime. gitleaks has no crypto-API
# context, so `generic-api-key` (entropy + `key` literal) tokens as a secret.
# Path-scoped allowlist below is the precise, narrow carve-out; everything else
# in the repo remains fully scanned.

title = "gitleaks config"

[extend]
useDefault = true

[[allowlists]]
  description = "HMAC 'key' is an API parameter name in crypto runtime stubs, not a secret value. Covers the canonical source tree AND testing/foundation-dll copies (codegen output distributed across SDK translates)"
  paths = [
    '''crypto_stubs_posix\.cpp''',
    '''crypto_stubs_win32\.cpp''',
    '''crypto_stubs\.cpp''',
    '''crypto_stubs\.h''',
    # The same crypto stubs are codegen'd into each DLL's SDK tree under
    # testing/foundation-dll/<dll>/chunks/*/native/chaos-sdk/.  These are
    # identical copies — the same 'key' parameter name, not a secret.
    '''testing/foundation-dll/.*/chaos-sdk/.*crypto_stubs\.''',
  ]

# Historic-only noise (files deleted from the current tree but still in DAG
# history that gitleaks re-scans with fetch-depth:0). These are not durable
# secrets: _fix_validator_types.py was a one-shot scratch validator carrying an
# api-key-literal-shaped constant; capability-snapshot.json is an auto-generated
# inventory whose rows happen to look high-entropy. Neither exists at HEAD, and
# neither ever held a usable credential. Allow by filename so history scans stop
# red-lighting them.
#
# Still-hit files (after round-7 crypto_stubs path fix):
#   docs/testing-inventory/verification/master/result-master.json   — 41 hits
#   docs/testing-inventory/verification/master/capability-master.json — 41 hits
#   docs/testing-inventory/verification/latest/result-snapshot.json   — 41 hits
#   docs/testing-inventory/verification/latest/capability-snapshot.json — 41 hits
# These are auto-generated test-inventory files full of high-entropy subjectId
# strings, not secrets; the files belong to an obsolete directory moved to
# docs/archive. Add path allowlist.
[[allowlists]]
  description = "Obsolete testing-inventory/verification files (auto-generated inventory data, never secrets)"
  paths = [
    '''docs/testing-inventory/verification/''',
    # 'latest' and 'master' subdirs under testing-inventory are also hit
    # by the generic-api-key rule, same pattern.
    '''docs/testing-inventory/verification/latest/''',
    '''docs/testing-inventory/verification/master/''',
  ]

# vtable_registry.cpp/h and bootstrap.cpp hit due to low-entropy SHA1-like
# constant strings in themselves (method hashes for method-replacement tables).
# These are not secrets — they are lookup keys for the vtable/method-resolution
# subsystem.
[[allowlists]]
  description = "Method-table / vtable hash strings (lookup keys, not secrets)"
  paths = [
    '''src/native/runtime-core/vtable_registry\.cpp''',
    '''src/native/runtime-core/vtable_registry\.h''',
    '''src/native/runtime-core/vtable_registry_resolve\.cpp''',
    '''src/native/bootstrap/bootstrap\.cpp''',
  ]

# Historic-only: deleted scratch validator that carried an api-key-literal-shaped
# constant (never a usable credential). Not at HEAD; allow by filename so the
# fetch-depth:0 history scan stops flagging it.
[[allowlists]]
  description = "Deleted scratch validator (non-secret, historic-only)"
  paths = [
    '''_fix_validator_types\.py''',
  ]
